<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Referal</title>
<link rel="stylesheet" href="style.css?v=1788371259">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{background:linear-gradient(170deg,#0a0a0a 0%,#0d1b2a 100%);}
.rf-hero{text-align:center;padding:24px 20px 18px;}
.rf-hero .ic{font-size:52px;margin-bottom:10px;}
.rf-hero h1{font-size:23px;font-weight:800;margin-bottom:7px;}
.rf-hero p{font-size:13.5px;color:var(--muted);line-height:1.6;}
.opt{
  display:flex;align-items:center;gap:14px;margin:0 16px 11px;padding:17px;
  border-radius:17px;background:#121212;border:1px solid var(--line);cursor:pointer;
}
.opt:active{background:#1a1a1a;}
.opt .em{font-size:29px;}
.opt .tx b{display:block;font-size:15px;font-weight:700;}
.opt .tx span{font-size:12px;color:var(--muted);}
.opt .ar{margin-left:auto;color:var(--muted);font-size:18px;}
.gift{
  display:flex;align-items:center;gap:13px;margin:0 16px 10px;padding:15px;
  border-radius:15px;background:#121212;border:1px solid var(--line);cursor:pointer;
}
.gift .tx{flex:1;}
.gift .tx b{display:block;font-size:14.5px;font-weight:700;}
.gift .tx span{font-size:12px;color:var(--muted);}
.gift .cnt{
  text-align:right;font-size:11px;color:var(--gold);font-weight:800;
  background:rgba(203,161,53,.12);padding:6px 10px;border-radius:9px;
}
.prog{
  margin:0 16px 16px;padding:20px;border-radius:22px;
  background:linear-gradient(135deg,rgba(203,161,53,.15),rgba(203,161,53,.04));
  border:1px solid rgba(203,161,53,.32);
}
.prog .gn{font-size:17px;font-weight:800;margin-bottom:3px;}
.prog .gp{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
.prog .bar{height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;}
.prog .bar i{
  display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg,#CBA135,#FFD700);
  transition:width 1s cubic-bezier(.2,.8,.2,1);
}
.prog .nums{display:flex;justify-content:space-between;margin-top:11px;font-size:12.5px;}
.prog .nums b{color:var(--gold);}
.rf-g{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:0 16px 16px;}
.rf-c{background:#121212;border:1px solid var(--line);border-radius:17px;padding:15px;text-align:center;}
.rf-c b{display:block;font-size:25px;font-weight:300;}
.rf-c span{font-size:10.5px;color:var(--muted);letter-spacing:.06em;}
.rf-link{margin:0 16px 16px;padding:16px;border-radius:17px;background:#121212;border:1px solid var(--line);}
.rf-link .lb{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-bottom:9px;}
.rf-link .val{font-size:12px;color:#0095F6;word-break:break-all;background:#0a0a0a;padding:11px;border-radius:10px;margin-bottom:11px;}
.rf-btns{display:flex;gap:9px;}
.rf-btns button{flex:1;padding:13px 0;border:none;border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.back{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;padding:14px 20px;}
</style>
</head>
<body>

<header class="topbar" style="display:flex;align-items:center;gap:10px;">
  <button id="refBack" style="width:34px;height:34px;border-radius:50%;border:none;
    background:rgba(255,255,255,.12);color:#fff;font-size:19px;cursor:pointer;
    flex-shrink:0;">&#8592;</button>
  <h1 style="flex:1;">🎁 Referal <span class="gold">dastur</span></h1>
</header>
<div id="root"><div class="load">Yuklanmoqda...</div></div>

<script src="i18n.js?v=1786724767"></script>
<script src="core3.js"></script>
<script>
let RF = null, GIFTS = null, GOAL = null;
let gender = null, gtype = null;

function boot(){
  const id = myId();
  if(!id){ el('root').innerHTML = '<div class="load">Telegram orqali oching</div>'; return; }

  Promise.all([
    api('/api/referal?tg_id=' + id),
    api('/api/sovgalar'),
    api('/api/maqsad?tg_id=' + id)
  ]).then(function(r){
    RF = r[0];
    GIFTS = r[1].gifts;
    GOAL = (r[2] && r[2].goal) ? r[2].goal : null;
    if(GOAL) drawMain(); else drawGender();
  }).catch(function(){
    el('root').innerHTML = '<div class="load">Xato yuz berdi</div>';
  });
}

function drawGender(){
  el('root').innerHTML =
    '<div class="rf-hero"><div class="ic">&#127873;</div>' +
    '<h1>Sovga uchun harakat</h1>' +
    '<p>Dostlaringizni taklif qilib<br>ozingizga sovga toplang</p></div>' +
    '<div class="opt" data-g="ogil"><span class="em">&#128102;</span>' +
    '<span class="tx"><b>Ogil bola</b><span>Erkak</span></span><span class="ar">&#8250;</span></div>' +
    '<div class="opt" data-g="qiz"><span class="em">&#128103;</span>' +
    '<span class="tx"><b>Qiz bola</b><span>Ayol</span></span><span class="ar">&#8250;</span></div>';

  document.querySelectorAll('.opt').forEach(function(o){
    o.addEventListener('click', function(){
      gender = o.dataset.g;
      haptic('light');
      drawType();
    });
  });
}

function drawType(){
  el('root').innerHTML =
    '<button class="back" id="bk">&#8592; Orqaga</button>' +
    '<div class="rf-hero" style="padding-top:6px;"><div class="ic">&#127919;</div>' +
    '<h1>Qanday sovga?</h1>' +
    '<p>Taklif qilingan dostlaringiz uchun<br>qanday sovga olmoqchisiz?</p></div>' +
    '<div class="opt" data-t="ijara"><span class="em">&#127968;</span>' +
    '<span class="tx"><b>Ijara uchun pul</b><span>Uy ijarasi toliq toblanadi</span></span>' +
    '<span class="ar">&#8250;</span></div>' +
    '<div class="opt" data-t="iphone"><span class="em">&#128241;</span>' +
    '<span class="tx"><b>iPhone</b><span>Xohlagan seriyangiz</span></span>' +
    '<span class="ar">&#8250;</span></div>' +
    '<div class="opt" data-t="samsung"><span class="em">&#128242;</span>' +
    '<span class="tx"><b>Samsung</b><span>Xohlagan seriyangiz</span></span>' +
    '<span class="ar">&#8250;</span></div>' +
    '<div class="opt" data-t="naqd"><span class="em">&#128176;</span>' +
    '<span class="tx"><b>Naqd pul</b><span>Kartangizga otkaziladi</span></span>' +
    '<span class="ar">&#8250;</span></div>';

  el('bk').addEventListener('click', drawGender);
  document.querySelectorAll('.opt').forEach(function(o){
    o.addEventListener('click', function(){
      gtype = o.dataset.t;
      haptic('light');
      drawGifts();
    });
  });
}

function drawGifts(){
  const list = GIFTS[gtype] || [];
  el('root').innerHTML =
    '<button class="back" id="bk">&#8592; Orqaga</button>' +
    '<div class="rf-hero" style="padding-top:6px;"><div class="ic">&#11088;</div>' +
    '<h1>Maqsadni tanlang</h1>' +
    '<p>Har bir taklif uchun <b style="color:#CBA135;">' + fmt(RF.reward) + ' som</b></p></div>' +
    list.map(function(g){
      return '<div class="gift" data-n="' + esc(g.name) + '" data-p="' + g.price + '">' +
        '<div class="tx"><b>' + esc(g.name) + '</b>' +
        '<span>' + fmt(g.price) + ' som</span></div>' +
        '<div class="cnt">' + fmt(g.needed) + '<br>taklif</div></div>';
    }).join('');

  el('bk').addEventListener('click', drawType);
  document.querySelectorAll('.gift').forEach(function(g){
    g.addEventListener('click', function(){
      if(!confirm('Maqsad: ' + g.dataset.n + '\n\nTanlaysizmi?')) return;
      apiPost('/api/maqsad', {
        gender: gender, goal_type: gtype,
        goal_name: g.dataset.n, goal_price: parseInt(g.dataset.p)
      }).then(function(d){
        if(d.ok){ haptic('medium'); boot(); }
        else toast('Xato');
      }).catch(function(){ toast('Server xatosi'); });
    });
  });
}

function drawMain(){
  el('root').innerHTML =
    '<div class="prog"><div class="gn">' + esc(GOAL.name) + '</div>' +
    '<div class="gp">' + fmt(GOAL.price) + ' som</div>' +
    '<div class="bar"><i style="width:' + GOAL.percent + '%"></i></div>' +
    '<div class="nums"><span>Yiglgan: <b>' + fmt(GOAL.balance) + '</b></span>' +
    '<span>' + GOAL.percent + '%</span></div></div>' +

    '<div class="rf-g">' +
      '<div class="rf-c"><b>' + fmt(RF.total) + '</b><span>TAKLIF QILINGAN</span></div>' +
      '<div class="rf-c"><b>' + fmt(GOAL.needed) + '</b><span>YANA KERAK</span></div>' +
    '</div>' +

    '<div class="rf-link"><div class="lb">SIZNING HAVOLANGIZ</div>' +
    '<div class="val">' + esc(RF.link) + '</div>' +
    '<div class="rf-btns">' +
    '<button style="background:#0095F6;color:#fff;" id="rfShare">Ulashish</button>' +
    '<button style="background:#262626;color:#fff;" id="rfCopy">Nusxa</button>' +
    '</div></div>' +

    '<div class="wrap"><button class="btn ghost" id="rfChange">Maqsadni ozgartirish</button></div>' +
    '<div style="height:90px;"></div>';

  el('rfShare').addEventListener('click', function(){
    const t = GOAL.owner_name + ' ' + GOAL.name + ' uchun harakat qilyapti!\n' +
      'Havolaga kiring va yordam bering 👇';
    const u = 'https://t.me/share/url?url=' + encodeURIComponent(RF.link) +
              '&text=' + encodeURIComponent(t);
    if(TG && TG.openTelegramLink) TG.openTelegramLink(u); else window.open(u, '_blank');
  });

  el('rfCopy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(RF.link);
    toast('Havola nusxalandi');
  });

  el('rfChange').addEventListener('click', function(){
    if(confirm('Maqsadni ozgartirasizmi?')) drawGender();
  });
}

document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 400); });

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof myId !== 'function' || !IS_ADMIN) return;
    if(typeof isApk === 'function' && !isApk()) return;

    const t = document.querySelector('.topbar h1') || document.querySelector('h1');
    if(!t) return;

    let ht = null;
    t.addEventListener('touchstart', function(){
      ht = setTimeout(function(){
        ht = null;
        if(typeof haptic === 'function') haptic('medium');
        if(typeof showAdminPanels === 'function') showAdminPanels(null, true);
      }, 700);
    }, { passive: true });
    t.addEventListener('touchend', function(){ if(ht) clearTimeout(ht); }, { passive: true });
    t.addEventListener('touchmove', function(){ if(ht) clearTimeout(ht); }, { passive: true });
  }, 900);
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof myId !== 'function' || !IS_ADMIN) return;

    const hh = document.querySelector('.topbar h1') || document.querySelector('h1');
    if(!hh || hh.querySelector('.pro-switch')) return;

    const txt = hh.innerHTML;
    hh.innerHTML = '';
    const b = document.createElement('button');
    b.className = 'pro-switch';
    b.innerHTML = '<span>' + txt + '</span><span class="cv">&#9660;</span>';
    hh.appendChild(b);

    b.addEventListener('click', function(){
      if(typeof haptic === 'function') haptic('light');
      if(typeof showAdminPanels === 'function') showAdminPanels(null, true);
    });
  }, 1000);
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof loadAdminState === 'function') loadAdminState();
  }, 500);
});

document.addEventListener('DOMContentLoaded', function(){
  const b = document.getElementById('refBack');
  if(b) b.addEventListener('click', function(){
    if(typeof haptic === 'function') haptic('light');
    location.href = 'xaridor.html';
  });
});
</script>
</body>
</html>
