<script src="core.js?v=1786724767"></script>

<script src="dm.js?v=1786724767"></script>

<script>
let POSTS = [];
let SELLERS = [];
let SUBS = {};
let LIKED = {};
let SAVED = [];

function boot(){
  if(typeof askLangOnce === 'function'){
    askLangOnce(function(){ bootAfterLang(); });
  } else bootAfterLang();
}

function bootAfterLang(){
  if(typeof showSplash === 'function' && isApk()){
    showSplash(function(){
      requireAuth(function(){
        checkSubs(function(){ askRole(function(){ bootAuthed(); }); });
      });
    });
  } else {
    requireAuth(function(){ checkSubs(function(){ bootAuthed(); }); });
  }
}

function bootAuthed(){
  checkRestriction(function(stop){
    if(stop) return;
    bootReal();
  });
}

function bootReal(){
  loadLocal();
  checkUser(function(u){
    if(needReg()){
      document.querySelector('.nav').style.display = 'none';
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('on'); });
      let r = el('root');
      if(!r){
        r = document.createElement('div');
        r.id = 'root';
        document.body.insertBefore(r, document.querySelector('.nav'));
      }
      r.style.display = 'block';
      showReg('xaridor', function(){
        r.style.display = 'none';
        document.querySelector('.nav').style.display = 'flex';
        el('vFeed').classList.add('on');
        realBoot();
      });
      return;
    }
    realBoot();
  });
}

function realBoot(){
  Promise.all([
    api('/api/maklerlar').catch(function(){ return { maklers: [] }; }),
    api('/api/postlar').catch(function(){ return { posts: [] }; })
  ]).then(function(r){
    SELLERS = r[0].maklers || [];
    POSTS = (r[1].posts || []).map(normalize);
    loadSubs(function(){
      drawStories();
      drawFeed();
      drawSellers();
      drawTop();
    });
  });
}

function normalize(p){
  const m = (p.media && p.media.length) ? p.media : [{ file_id: p.file_id, is_video: p.is_video }];
  return {
    id: p.id,
    username: p.username,
    price: p.price || '',
    desc: p.description || '',
    media: m.filter(function(x){ return x.file_id; }).map(function(x){
      return { url: mediaUrl(x.file_id), video: !!x.is_video };
    }),
    views: p.views || 0,
    likes: p.likes || 0,
    pano: !!p.pano,
    created: p.created || '',
    comments: p.comments || []
  };
}

function vBadge(s){
  return (s && s.verified)
    ? '<svg class="vbadge" viewBox="0 0 24 24" fill="#0095F6"><path d="M12 1l2.5 2.2 3.3-.4 1 3.2 3 1.5-1.2 3.1 1.2 3.1-3 1.5-1 3.2-3.3-.4L12 23l-2.5-2.2-3.3.4-1-3.2-3-1.5 1.2-3.1L2.2 10l3-1.5 1-3.2 3.3.4z"/><path d="M10.5 15.2l-3-3 1.2-1.2 1.8 1.8 4.3-4.3 1.2 1.2z" fill="#000"/></svg>'
    : '';
}


function timeAgo(s){
  if(!s) return '';
  const d = new Date(String(s).replace(' ', 'T'));
  if(isNaN(d)) return '';
  const m = Math.floor((Date.now() - d.getTime()) / 60000);
  if(m < 1) return 'hozirgina';
  if(m < 60) return m + ' daqiqa oldin';
  const h = Math.floor(m / 60);
  if(h < 24) return h + ' soat oldin';
  const dd = Math.floor(h / 24);
  if(dd < 7) return dd + ' kun oldin';
  if(dd < 30) return Math.floor(dd / 7) + ' hafta oldin';
  return Math.floor(dd / 30) + ' oy oldin';
}

function sellerOf(u){
  for(let i = 0; i < SELLERS.length; i++){
    if(SELLERS[i].username === u) return SELLERS[i];
  }
  return null;
}

function avaOf(u){
  const s = sellerOf(u);
  if(s && s.avatar) return mediaUrl(s.avatar);
  return 'https://api.dicebear.com/7.x/initials/svg?seed=' + encodeURIComponent(s ? s.name : u);
}

function loadSubs(cb){
  const id = myId();
  if(!id || !SELLERS.length){ cb(); return; }
  let n = 0;
  SELLERS.forEach(function(s){
    api('/api/obuna-holat?username=' + encodeURIComponent(s.username) + '&follower_id=' + id)
      .then(function(d){ SUBS[s.username] = !!d.following; s.followers = d.followers || 0; })
      .catch(function(){})
      .then(function(){ n++; if(n === SELLERS.length) cb(); });
  });
}

function loadLocal(){
  try { SAVED = JSON.parse(localStorage.getItem('ni_saved')) || []; } catch(e){ SAVED = []; }
  try { LIKED = JSON.parse(localStorage.getItem('ni_liked')) || {}; } catch(e){ LIKED = {}; }
}

function keepLocal(){
  try { localStorage.setItem('ni_saved', JSON.stringify(SAVED)); } catch(e){}
  try { localStorage.setItem('ni_liked', JSON.stringify(LIKED)); } catch(e){}
}

function drawStories(){
  const box = el('stories');
  loadStories(function(){
    const groups = groupStories();
    if(!groups.length){ box.style.display = 'none'; return; }
    box.style.display = 'flex';
    box.innerHTML = groups.map(function(g, i){
      const seenAll = g.items.every(function(s){ return isStorySeen(s.id); });
      return '<button class="story" data-i="' + i + '">' +
        '<div class="story-ring ' + (seenAll ? 'seen' : 'fresh') + '"><img src="https://api.dicebear.com/7.x/initials/svg?seed=' +
        encodeURIComponent(g.name) + '"></div>' +
        '<span>' + esc(g.name) + '</span></button>';
    }).join('');
    box.querySelectorAll('.story').forEach(function(b){
      b.addEventListener('click', function(){
        openStory(groups[parseInt(b.dataset.i)], 0);
      });
    });
  });
}

function drawFeed(){
  setTimeout(function(){
    const f = el('feed');
    if(f && typeof injectAds === 'function') injectAds(f, 'feed', 5);
  }, 800);

  const box = el('feed');
  const sub = SELLERS.filter(function(s){ return SUBS[s.username]; })
                     .map(function(s){ return s.username; });
  let list = sub.length ? POSTS.filter(function(p){ return sub.indexOf(p.username) !== -1; }) : POSTS;
  if(!list.length) list = POSTS;
  if(!list.length){
    box.innerHTML = '<div class="empty"><div class="ic">&#128235;</div>' +
      '<p>Hali elon yoq</p><span>Sotuvchilar elon joylagach shu yerda chiqadi</span></div>';
    return;
  }
  box.innerHTML = list.map(postHTML).join('');
  bindPosts(box);
}
function postHTML(p){
  const s = sellerOf(p.username);
  const slides = p.media.map(function(m){
    return '<div class="slide">' + (m.video
      ? '<video src="' + m.url + '" muted loop playsinline preload="metadata"></video>'
      : '<img src="' + m.url + '" loading="lazy">') + '</div>';
  }).join('');

  const dots = p.media.length > 1
    ? '<div class="dots">' + p.media.map(function(_, i){
        return '<div class="dot' + (i === 0 ? ' on' : '') + '"></div>';
      }).join('') + '</div><div class="counter">1/' + p.media.length + '</div>'
    : '';

  const lines = p.desc.split('\n');
  const head = lines[0] || '';
  const rest = lines.slice(1).join('\n');
  const isSell = head.indexOf('Sotiladi') === 0;
  const hasTag = isSell || head.indexOf('Ijaraga') === 0;
  const tag = hasTag ? '<span class="tag ' + (isSell ? 'sell' : 'rent') + '">' + esc(head) + '</span>' : '';
  const body = hasTag ? rest : p.desc;

  const liked = LIKED[p.id] ? ' liked' : '';
  const saved = SAVED.indexOf(p.id) !== -1 ? ' on' : '';

  return '<article class="post" data-id="' + p.id + '">' +
    '<div class="post-head" data-u="' + esc(p.username) + '">' +
      '<img src="' + avaOf(p.username) + '">' +
      '<b>' + esc(s ? s.name : p.username) + vBadge(s) + '</b>' +
      ((p.media && p.media[0] && p.media[0].video)
        ? '<span class="badge">' + fmt(p.views) + ' korish</span>' : '') +
    '</div>' +
    '<div class="slider"><div class="slides">' + slides + '</div>' + dots +
      (p.pano ? '<div class="pano-badge">&#127760; 360&deg;</div>' : '') +
      '<svg class="big-heart" viewBox="0 0 24 24" fill="#fff"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>' +
    '</div>' +
    '<div class="acts">' +
      '<button class="act like' + liked + '">' +
        '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>' +
        '<span>' + fmt(p.likes) + '</span></button>' +
      '<button class="act cm">' +
        '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l2-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>' +
        '<span>' + fmt(p.comments.length) + '</span></button>' +
      '<button class="act share">' +
        '<svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>' +
      '<button class="act save' + saved + '">' +
        '<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>' +
    '</div>' +
    '<div class="post-body">' +
      (p.price ? '<div class="price">' + esc(p.price) + '</div>' : '') + tag +
      (body ? '<div class="desc">' + esc(body) + '</div>' : '') +
    '</div>' +
    (p.created ? '<div class="post-time">' + timeAgo(p.created) + '</div>' : '') +
    '</article>';
}

function bindPosts(box){
  box.querySelectorAll('.post').forEach(function(art){
    const id = parseInt(art.dataset.id);
    let p = null;
    for(let i = 0; i < POSTS.length; i++){ if(POSTS[i].id === id){ p = POSTS[i]; break; } }
    if(!p) return;

    const slider = art.querySelector('.slider');
    const slides = art.querySelector('.slides');
    const dots = art.querySelectorAll('.dot');
    const counter = art.querySelector('.counter');
    let idx = 0, x0 = null;

    slider.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, { passive: true });
    slider.addEventListener('touchend', function(e){
      if(x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      x0 = null;
      if(Math.abs(dx) < 45) return;
      if(dx < 0 && idx < p.media.length - 1) idx++;
      else if(dx > 0 && idx > 0) idx--;
      else return;
      slides.style.transform = 'translateX(-' + (idx * 100) + '%)';
      dots.forEach(function(d, i){ d.classList.toggle('on', i === idx); });
      if(counter) counter.textContent = (idx + 1) + '/' + p.media.length;
    }, { passive: true });

    let lastTap = 0;
    slider.addEventListener('click', function(){
      const now = Date.now();
      if(now - lastTap < 320){ lastTap = 0; doLike(art, p, true); }
      else {
        lastTap = now;
        if(p.pano && p.media[0]){
          setTimeout(function(){
            if(lastTap) openPano(p.media[0].url);
          }, 330);
        }
      }
    });

    art.querySelector('.like').addEventListener('click', function(){ doLike(art, p, false); });
    art.querySelector('.like span').addEventListener('click', function(e){
      e.stopPropagation();
      if(p.likes > 0) openLikers(p);
    });
    art.querySelector('.cm').addEventListener('click', function(){ openComments(p); });
    art.querySelector('.share').addEventListener('click', function(){ openShare(p); });
    art.querySelector('.save').addEventListener('click', function(){ doSave(art, p); });
    art.querySelector('.post-head').addEventListener('click', function(){ openSeller(p.username); });
  });

  if(window.IntersectionObserver){
    const seen = {};
    const vio = new IntersectionObserver(function(en){
      en.forEach(function(e){
        if(!e.isIntersecting) return;
        const id = parseInt(e.target.dataset.id);
        if(!id || seen[id]) return;
        seen[id] = true;
        apiPost('/api/korish', { post_id: id }).catch(function(){});
      });
    }, { threshold: 0.5 });
    box.querySelectorAll('.post').forEach(function(a){ vio.observe(a); });
  }

  const vids = box.querySelectorAll('video');
  if(vids.length && window.IntersectionObserver){
    const io = new IntersectionObserver(function(en){
      en.forEach(function(e){
        if(e.isIntersecting) e.target.play().catch(function(){});
        else e.target.pause();
      });
    }, { threshold: 0.6 });
    vids.forEach(function(v){ io.observe(v); });
  }
}

function doLike(art, p, force){
  const btn = art.querySelector('.like');
  const on = !!LIKED[p.id];
  const heart = art.querySelector('.big-heart');

  if(force && on){
    heart.classList.remove('pop'); void heart.offsetWidth; heart.classList.add('pop');
    return;
  }

  LIKED[p.id] = !on;
  p.likes = Math.max(0, p.likes + (on ? -1 : 1));
  btn.classList.toggle('liked', !on);
  btn.querySelector('span').textContent = fmt(p.likes);
  keepLocal();
  haptic('light');

  if(!on){
    heart.classList.remove('pop'); void heart.offsetWidth; heart.classList.add('pop');
  }
  apiPost('/api/layk', { post_id: p.id, action: on ? 'unlike' : 'like' }).catch(function(){});
}

function doSave(art, p){
  const i = SAVED.indexOf(p.id);
  if(i === -1) SAVED.push(p.id); else SAVED.splice(i, 1);
  art.querySelector('.save').classList.toggle('on', i === -1);
  keepLocal();
  toast(i === -1 ? 'Saqlandi' : 'Saqlanganlardan olindi');
}

function sharePost(p){
  const txt = [p.desc, p.price ? 'Narx: ' + p.price : '', '@' + p.username].filter(Boolean).join('\n');
  const url = 'https://t.me/share/url?url=' + encodeURIComponent('https://t.me/Ijaraga_uybot') +
              '&text=' + encodeURIComponent(txt);
  if(TG && TG.openTelegramLink) TG.openTelegramLink(url);
  else window.open(url, '_blank');
}
function openComments(p){
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" id="cmSheet"><div class="sheet-bar"></div>' +
    '<div class="sheet-title">Komentariyalar</div>' +
    '<div class="cm-list" id="cmList"></div>' +
    '<div class="cm-bar"><input id="cmInp" placeholder="Komentariya yozing...">' +
    '<button id="cmSend">Yuborish</button></div></div>';
  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
  el('cmSheet').addEventListener('click', function(e){ e.stopPropagation(); });

  el('cmList').innerHTML = '<div class="load">Yuklanmoqda...</div>';
  api('/api/komentlar?post_id=' + p.id)
    .then(function(d){
      p.comments = (d.ok && d.comments) ? d.comments : [];
      draw();
      const art = document.querySelector('.post[data-id="' + p.id + '"]');
      if(art){
        const sp = art.querySelector('.cm span');
        if(sp) sp.textContent = fmt(p.comments.length);
      }
    })
    .catch(function(){ draw(); });

  el('cmSend').addEventListener('click', send);
  el('cmInp').addEventListener('keypress', function(e){ if(e.key === 'Enter') send(); });

  function send(){
    const inp = el('cmInp');
    const t = inp.value.trim();
    if(!t) return;
    let nm = 'Siz';
    try { nm = TG.initDataUnsafe.user.first_name || 'Siz'; } catch(e){}
    p.comments.push({ name: nm, text: t });
    inp.value = '';
    draw();
    apiPost('/api/koment', { post_id: p.id, text: t }).catch(function(){});
    haptic('light');

    const art = document.querySelector('.post[data-id="' + p.id + '"]');
    if(art){
      const sp = art.querySelector('.cm span');
      if(sp) sp.textContent = fmt(p.comments.length);
    }
  }

  function draw(){
    const box = el('cmList');
    if(!box) return;
    if(!p.comments.length){
      box.innerHTML = '<div class="empty" style="padding:40px 10px;">' +
        '<span>Hali komentariya yoq.<br>Birinchi boling!</span></div>';
      return;
    }
    box.innerHTML = p.comments.map(function(c){
      return '<div class="cm"><img src="https://api.dicebear.com/7.x/initials/svg?seed=' +
        encodeURIComponent(c.name) + '"><div class="cm-txt"><b>' + esc(c.name) +
        '</b><p>' + esc(c.text) + '</p></div></div>';
    }).join('');
  }
}


function drawTop(){
  const box = el('topList');
  if(!box) return;

  api('/api/top').then(function(d){
    const list = d.top || [];
    if(!list.length){

function drawSellers(){
  const box = el('sellers');
  if(!SELLERS.length){
    box.innerHTML = '<div class="empty"><div class="ic">&#128101;</div>' +
      '<p>Hali sotuvchi yoq</p><span>Tez orada qoshiladi</span></div>';

  }
  const sorted = SELLERS.slice().sort(function(a, b){ return (b.followers||0) - (a.followers||0); });
  box.innerHTML = sorted.map(function(s){
    const roles = (s.roles || []).map(function(r){
      return r === 'sotuvchi' ? '<span class="role s">Sotuvchi</span>'
                              : '<span class="role i">Ijarachi</span>';
    }).join('');
    const on = SUBS[s.username] ? ' on' : '';

      '<span>@' + esc(s.username) + ' &middot; ' + fmt(s.followers) + ' obunachi</span>' +

      '<button class="follow-btn' + on + '" data-f="' + esc(s.username) + '">' + txt + '</button></div>';

    b.addEventListener('click', function(e){ e.stopPropagation(); toggleFollow(b.dataset.f); });

  box.querySelectorAll('.seller').forEach(function(d){
    d.addEventListener('click', function(){ openSeller(d.dataset.u); });

const OWNER = 'bahromjon';

function toggleFollow(u){
  if(!myId()){ toast('Telegram orqali kiring'); return; }
  if(u === OWNER && SUBS[u]){
    toast('Asosiy kanalga obuna majburiy');
    return;
  }
  const on = !!SUBS[u];
  apiPost('/api/obuna', { action: on ? 'unfollow' : 'follow', username: u })
    .then(function(d){
      if(d.ok){
        SUBS[u] = d.following;
        const s = sellerOf(u);
        if(s) s.followers = d.followers;
        haptic('light');
        drawSellers(); drawStories(); drawFeed();
      } else toast('Xato yuz berdi');
    })
    .catch(function(){ toast('Server xatosi'); });
}

function cellHTML(p){
  const m = p.media[0] || {};
  const inner = m.video
    ? '<video src="' + m.url + '" muted preload="metadata"></video>'
    : '<img src="' + m.url + '" loading="lazy">';

    ? '<svg class="multi" viewBox="0 0 24 24" fill="#fff"><rect x="7" y="3" width="14" height="14" rx="2"/><rect x="3" y="7" width="14" height="14" rx="2" opacity=".85"/></svg>'
    : '';
  return '<div class="cell">' + inner + multi + '</div>';
}

  if(q.indexOf('@') === 0){
    const t = q.slice(1);
    const list = SELLERS.filter(function(s){
      return s.username.toLowerCase().indexOf(t) !== -1 || s.name.toLowerCase().indexOf(t) !== -1;
    });
    box.innerHTML = list.length
      ? list.map(function(s){
          return '<div class="seller" data-u="' + esc(s.username) + '">' +
            '<img src="' + avaOf(s.username) + '"><div class="seller-info"><b>' + esc(s.name) +
            '</b><span>@' + esc(s.username) + '</span></div></div>';
        }).join('')
      : '<div class="empty"><span>Topilmadi</span></div>';
    box.querySelectorAll('.seller').forEach(function(d){
      d.addEventListener('click', function(){ openSeller(d.dataset.u); });
    });
    return;
  }

  const list = q ? POSTS.filter(function(p){
    return p.desc.toLowerCase().indexOf(q) !== -1 ||
           p.price.toLowerCase().indexOf(q) !== -1 ||
           p.username.toLowerCase().indexOf(q) !== -1;

    ? '<div class="grid">' + list.map(cellHTML).join('') + '</div>'

    '<div class="sheet-bar"></div>' +

      '<div style="background:rgba(255,193,7,.1);border:1px solid rgba(255,193,7,.35);' +
      'border-radius:12px;padding:13px;margin-bottom:20px;font-size:12.5px;color:#FFC107;' +
      'line-height:1.5;">&#9888;&#65039; Eslatma: profil maʼlumotlari <b>oyiga bir marta</b> yangilanadi.</div>' +
      '<label class="label">Ism familiya</label>' +
      '<input class="inp" id="epName" value="' + esc(u.name || '') + '" placeholder="Ism va familiyangiz">' +
      '<label class="label">Nik nomi</label>' +
      '<input class="inp" id="epNick" value="' + esc(u.nickname || '') + '" placeholder="bahromjon">' +
      '<button class="btn" id="epSave">Saqlash</button>' +
      '<button class="btn ghost" id="epCancel" style="margin-top:9px;">Bekor qilish</button>' +
    '</div></div>';

  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
  el('epSheet').addEventListener('click', function(e){ e.stopPropagation(); });
  el('epCancel').addEventListener('click', function(){ bg.remove(); });

  el('epSave').addEventListener('click', function(){
    const n = el('epName').value.trim();
    const nk = el('epNick').value.trim().replace(/^@/, '');
    if(n.length < 2){ toast('Ismni kiriting'); return; }
    if(!confirm('Saqlaysizmi?\n\nKeyingi ozgartirish 30 kundan keyin mumkin boladi.')) return;

    const b = el('epSave');
    b.disabled = true;
    b.textContent = 'Saqlanmoqda...';

    apiPost('/api/profil-saqlash', { name: n, nickname: nk })
      .then(function(d){
        if(d.ok){
          haptic('medium');

          USER.can_edit = false; USER.edit_days = 30;
          toast('Saqlandi');
          bg.remove();
          drawProfile();

          toast((d.days || 0) + ' kundan keyin ozgartirasiz');
          b.disabled = false;
          b.textContent = 'Saqlash';
        } else {
          toast('Xato');
          b.disabled = false;
          b.textContent = 'Saqlash';
        }
      }).catch(function(){
        toast('Server xatosi');
        b.disabled = false;
        b.textContent = 'Saqlash';
      });
  });
}

function doSearch(q){
  q = (q || '').trim().toLowerCase();
  const box = el('results');
  if(!box) return;

  if(qMode === 'users'){
    const list = SELLERS.filter(function(s){
      if(!q) return true;
      return (s.name || '').toLowerCase().indexOf(q) !== -1 ||
             (s.username || '').toLowerCase().indexOf(q) !== -1;
    });

    if(!list.length){
      box.innerHTML = '<div class="empty" style="padding:60px 20px;">' +
        '<div class="ic">&#128100;</div><p>Topilmadi</p></div>';
      return;
    }

    box.innerHTML = list.map(function(s){
      const ava = s.avatar
        ? mediaUrl(s.avatar)
        : 'https://api.dicebear.com/7.x/initials/svg?seed=' + encodeURIComponent(s.name);
      return '<div class="chat-row" data-u="' + esc(s.username) + '" style="cursor:pointer;">' +
        '<div class="chat-ava"><img src="' + ava + '"></div>' +
        '<div class="ci"><b>' + esc(s.name) + vBadge(s) + '</b>' +
        '<span>@' + esc(s.username) + ' &middot; ' + fmt(s.followers) + ' obunachi</span></div>' +
        '<span style="color:#555;font-size:17px;">&rsaquo;</span></div>';
    }).join('');

    box.querySelectorAll('.chat-row[data-u]').forEach(function(r){
      r.addEventListener('click', function(){
        openUserProfile(null, r.dataset.u);
      });
    });
    return;
  }

  // E'lonlar
  const list = POSTS.filter(function(p){
    if(!q) return true;
    return String(p.desc || '').toLowerCase().indexOf(q) !== -1 ||
           String(p.price || '').toLowerCase().indexOf(q) !== -1 ||
           String(p.username || '').toLowerCase().indexOf(q) !== -1;
  });

  if(!list.length){
    box.innerHTML = '<div class="empty" style="padding:60px 20px;">' +
      '<div class="ic">&#128269;</div><p>Topilmadi</p></div>';
    return;
  }

  box.innerHTML = '<div class="grid">' + list.map(function(p){
    const f = (p.media && p.media[0]) ? p.media[0] : null;
    if(!f) return '';
    return '<div class="cell" data-id="' + p.id + '">' +
      (f.video ? '<video src="' + f.url + '" muted></video>' : '<img src="' + f.url + '">') +
      (p.media.length > 1 ? '<span class="multi">&#9673;</span>' : '') + '</div>';
  }).join('') + '</div>';

  box.querySelectorAll('.cell[data-id]').forEach(function(c){
    c.addEventListener('click', function(){
      const p = POSTS.filter(function(x){ return String(x.id) === c.dataset.id; })[0];
      if(!p) return;
      openUserProfile(null, p.username);
    });
  });
}

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof loadAdminState === 'function') loadAdminState();
  }, 500);
});
</script>
</body>
</html>
