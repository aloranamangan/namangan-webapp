<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arxiv</title>
<link rel="stylesheet" href="style.css?v=1788109748">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
.ax-top{
  display:flex;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  position:sticky;top:0;z-index:60;
  background:linear-gradient(180deg,rgba(0,0,0,.96),transparent);
  backdrop-filter:blur(14px);
}
.ax-top h1{font-size:19px;font-weight:800;flex:1;}
.ax-top button{
  width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(255,255,255,.12);color:#fff;font-size:19px;cursor:pointer;
}
.ax-info{
  font-size:12.5px;color:var(--muted);
  padding:0 16px 16px;line-height:1.55;
}
.ax-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 2px;}
.ax-cell{
  aspect-ratio:9/16;background:#111;position:relative;
  overflow:hidden;cursor:pointer;border-radius:3px;
}
.ax-cell img,.ax-cell video{width:100%;height:100%;object-fit:cover;}
.ax-cell .dt{
  position:absolute;left:0;right:0;bottom:0;
  padding:14px 6px 5px;
  background:linear-gradient(transparent,rgba(0,0,0,.8));
  font-size:9.5px;font-weight:700;color:#fff;
}
.ax-cell .vd{
  position:absolute;top:5px;right:5px;
  font-size:11px;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.ax-month{
  font-size:13px;font-weight:800;color:#fff;
  padding:18px 16px 10px;letter-spacing:.03em;
}
</style>
</head>
<body>

<div class="ax-top">
  <button id="axBack">&#8592;</button>
  <h1>🗄 Arxiv</h1>
</div>

<div class="ax-info">
  Storieslaringiz 24 soatdan keyin shu yerda saqlanadi.<br>
  Bosib ko'rishingiz yoki aktualga qo'shishingiz mumkin.
</div>

<div id="axBody"><div class="load">Yuklanmoqda...</div></div>

<script src="core.js?v=1788258293"></script>
<script>
let AX = [];

const OYLAR = ['Yanvar','Fevral','Mart','Aprel','May','Iyun',
               'Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];

function boot(){
  const id = myId();
  if(!id){ el('axBody').innerHTML = '<div class="load">Kirish kerak</div>'; return; }

  api('/api/arxiv?tg_id=' + id + '&t=' + Date.now()).then(function(d){
    AX = d.items || [];
    draw();
  }).catch(function(){
    el('axBody').innerHTML = '<div class="load">Xato yuz berdi</div>';
  });
}

function draw(){
  if(!AX.length){
    el('axBody').innerHTML =
      '<div class="empty" style="padding:70px 20px;">' +
      '<div class="ic">&#128451;</div><p>Arxiv bosh</p>' +
      '<span>Storiy joylang &mdash; 24 soatdan keyin<br>shu yerda saqlanadi</span></div>';
    return;
  }

  // Oylar bo'yicha guruhlash
  const grup = {};
  AX.forEach(function(s){
    let k = 'Boshqa';
    if(s.sana && s.sana.length > 6){
      const dt = new Date(String(s.sana).replace(' ', 'T'));
      if(!isNaN(dt)) k = OYLAR[dt.getMonth()] + ' ' + dt.getFullYear();
    }
    if(!grup[k]) grup[k] = [];
    grup[k].push(s);
  });

  let html = '';
  Object.keys(grup).forEach(function(oy){
    html += '<div class="ax-month">' + esc(oy) + '</div>';
    html += '<div class="ax-grid">' + grup[oy].map(function(s){
      const u = mediaUrl(s.file_id);
      let kun = '';
      if(s.sana && s.sana.length > 6){
        const dt = new Date(String(s.sana).replace(' ', 'T'));
        if(!isNaN(dt)) kun = dt.getDate() + '.' + (dt.getMonth() + 1);
      }
      return '<div class="ax-cell" data-f="' + esc(s.file_id) + '" data-v="' +
        (s.is_video ? '1' : '0') + '">' +
        (s.is_video
          ? '<video src="' + u + '" muted></video><span class="vd">&#9654;</span>'
          : '<img src="' + u + '">') +
        (kun ? '<span class="dt">' + kun + '</span>' : '') +
        '</div>';
    }).join('') + '</div>';
  });

  el('axBody').innerHTML = html + '<div style="height:30px;"></div>';

  document.querySelectorAll('.ax-cell').forEach(function(c){
    c.addEventListener('click', function(){
      ochish(c.dataset.f, c.dataset.v === '1');
    });
  });
}

function ochish(fid, video){
  const u = mediaUrl(fid);

  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:9500;background:#000;' +
    'display:flex;flex-direction:column;';

  ov.innerHTML =
    '<div style="flex:1;display:flex;align-items:center;justify-content:center;">' +
      (video
        ? '<video src="' + u + '" style="max-width:100%;max-height:100%;" controls autoplay></video>'
        : '<img src="' + u + '" style="max-width:100%;max-height:100%;object-fit:contain;">') +
    '</div>' +
    '<div style="padding:16px 20px calc(24px + env(safe-area-inset-bottom));' +
      'display:flex;gap:10px;">' +
      '<button id="axHl" style="flex:1;padding:14px 0;border:none;border-radius:14px;' +
        'background:#0095F6;color:#fff;font-size:14px;font-weight:800;' +
        'cursor:pointer;font-family:inherit;">Aktualga qoshish</button>' +
      '<button id="axCls" style="padding:14px 22px;border:none;border-radius:14px;' +
        'background:#262626;color:#fff;font-size:14px;font-weight:700;' +
        'cursor:pointer;font-family:inherit;">Yopish</button>' +
    '</div>';

  document.body.appendChild(ov);

  el('axCls').addEventListener('click', function(){ ov.remove(); });

  el('axHl').addEventListener('click', function(){
    const nom = prompt('Aktual nomi:', 'Aktual');
    if(!nom) return;

    apiPost('/api/aktual-qoshish', {
      file_id: fid, is_video: video, title: nom.slice(0, 20)
    }).then(function(d){
      if(d.ok){ haptic('medium'); toast('Aktualga qoshildi'); ov.remove(); }
      else toast('Xato');
    }).catch(function(){ toast('Server xatosi'); });
  });
}

document.addEventListener('DOMContentLoaded', function(){
  el('axBack').addEventListener('click', function(){ location.href = 'xaridor.html'; });
  setTimeout(boot, 400);
});
</script>
</body>
</html>
