<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Boshqaruv</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
.mn{
  display:flex;align-items:center;gap:14px;margin:0 16px 11px;padding:17px;
  border-radius:17px;background:#121212;border:1px solid var(--line);cursor:pointer;
}
.mn:active{background:#1a1a1a;}
.mn.soon{opacity:.45;}
.mn .em{font-size:26px;width:34px;text-align:center;}
.mn .tx{flex:1;}
.mn .tx b{display:block;font-size:15px;font-weight:700;}
.mn .tx span{font-size:12px;color:var(--muted);}
.mn .ar{color:var(--muted);font-size:18px;}
.mn .badge{
  font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:5px;
  background:rgba(255,193,7,.16);color:#FFC107;
}
</style>
</head>
<body>

<header class="topbar" style="display:flex;align-items:center;gap:12px;">
  <h1 style="flex:1;">⚙️ Boshqaruv <span class="gold">paneli</span></h1>
  <button id="zx" style="width:36px;height:36px;border-radius:50%;border:none;
    background:#1a1a1a;color:#fff;font-size:20px;cursor:pointer;">&times;</button>
</header>

<div style="padding:8px 0 20px;">

<div class="mn" data-go="reklama.html">
  <span class="em">📢</span>
  <span class="tx"><b>Reklama</b><span>Banner joylash va boshqarish</span></span>
  <span class="ar">›</span>
</div>

<div class="mn soon" data-soon="1">
  <span class="em">📨</span>
  <span class="tx"><b>Xabar yuborish</b><span>Barcha foydalanuvchilarga</span></span>
  <span class="badge">TEZ ORADA</span>
</div>

<div class="mn soon" data-soon="1">
  <span class="em">👨‍💼</span>
  <span class="tx"><b>Adminlar</b><span>Qo'shish va chiqarish</span></span>
  <span class="badge">TEZ ORADA</span>
</div>

<div class="mn soon" data-soon="1">
  <span class="em">📣</span>
  <span class="tx"><b>Kanallar</b><span>Majburiy obuna</span></span>
  <span class="badge">TEZ ORADA</span>
</div>

<div class="mn soon" data-soon="1">
  <span class="em">💳</span>
  <span class="tx"><b>To'lovlar</b><span>Tariflar va tekshiruv</span></span>
  <span class="badge">TEZ ORADA</span>
</div>

</div>

<script src="core.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const zb = document.getElementById('zx');
  if(zb) zb.addEventListener('click', function(){
    let last = null;
    try { last = localStorage.getItem('ni_admin_panel'); } catch(e){}
    if(last && last !== 'zaxira.html') location.href = last;
    else location.href = 'sotuvchi.html';
  });

  document.querySelectorAll('.mn').forEach(function(m){
    m.addEventListener('click', function(){
      if(m.dataset.soon){ toast('Bu bolim tayyorlanmoqda'); return; }
      location.href = m.dataset.go;
    });
  });
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof myId !== 'function' || myId() !== 7894423610) return;
    if(typeof isApk === 'function' && !isApk()) return;

    const t = document.querySelector('.topbar h1') || document.querySelector('h1');
    if(!t) return;

    let ht = null;
    t.addEventListener('touchstart', function(){
      ht = setTimeout(function(){
        ht = null;
        if(typeof haptic === 'function') haptic('medium');
        if(typeof showAdminPanels === 'function') showAdminPanels(null, true);
      }, 700);
    }, { passive: true });
    t.addEventListener('touchend', function(){ if(ht) clearTimeout(ht); }, { passive: true });
    t.addEventListener('touchmove', function(){ if(ht) clearTimeout(ht); }, { passive: true });
  }, 900);
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof myId !== 'function' || myId() !== 7894423610) return;

    const hh = document.querySelector('.topbar h1') || document.querySelector('h1');
    if(!hh || hh.querySelector('.pro-switch')) return;

    const txt = hh.innerHTML;
    hh.innerHTML = '';
    const b = document.createElement('button');
    b.className = 'pro-switch';
    b.innerHTML = '<span>' + txt + '</span><span class="cv">&#9660;</span>';
    hh.appendChild(b);

    b.addEventListener('click', function(){
      if(typeof haptic === 'function') haptic('light');
      if(typeof showAdminPanels === 'function') showAdminPanels(null, true);
    });
  }, 1000);
});
</script>
</body>
</html>
