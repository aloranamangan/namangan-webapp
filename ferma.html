<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ferma</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{
  background:linear-gradient(175deg,#0F1A0D 0%,#16250F 45%,#0A1208 100%);
  padding-bottom:100px;
}
.fm-top{
  display:flex;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  position:sticky;top:0;z-index:60;
  background:linear-gradient(180deg,rgba(15,26,13,.96),transparent);
  backdrop-filter:blur(14px);
}
.fm-top h1{font-size:20px;font-weight:800;flex:1;color:#fff;}
.fm-x{
  width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(255,255,255,.1);color:#fff;font-size:19px;cursor:pointer;
}

/* Balans */
.fm-bal{
  margin:0 16px 14px;padding:18px;border-radius:20px;
  background:linear-gradient(135deg,#2D5016,#4A7C1F);
  box-shadow:0 8px 26px rgba(74,124,31,.35);
  position:relative;overflow:hidden;
}
.fm-bal::before{
  content:'';position:absolute;top:-40%;right:-15%;
  width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.07);
}
.fm-bal .lb{font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.7;}
.fm-bal .sum{
  font-size:34px;font-weight:800;letter-spacing:-1px;margin:5px 0 3px;
  font-variant-numeric:tabular-nums;
}
.fm-bal .cur{font-size:13px;opacity:.65;}

/* Yig'ish */
.fm-collect{
  margin:0 16px 16px;padding:16px;border-radius:18px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;gap:14px;
}
.fm-collect .i{flex:1;}
.fm-collect .i b{display:block;font-size:22px;font-weight:800;color:#8BC34A;}
.fm-collect .i span{font-size:11.5px;color:rgba(255,255,255,.5);}
.fm-collect button{
  padding:12px 20px;border:none;border-radius:13px;
  background:#8BC34A;color:#0F1A0D;font-size:14px;font-weight:800;
  cursor:pointer;font-family:inherit;white-space:nowrap;
}
.fm-collect button:disabled{opacity:.35;}

/* Tablar */
.fm-tabs{display:flex;gap:8px;padding:0 16px 14px;}
.fm-tab{
  flex:1;padding:11px 0;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.55);cursor:pointer;font-family:inherit;
  font-size:12.5px;font-weight:700;
}
.fm-tab.on{background:#8BC34A;color:#0F1A0D;border-color:#8BC34A;}

/* Hayvonlar */
.fm-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 16px;}
.fm-card{
  padding:15px 12px;border-radius:18px;text-align:center;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  cursor:pointer;transition:transform .2s;
}
.fm-card:active{transform:scale(.97);}
.fm-card.have{border-color:rgba(139,195,74,.4);background:rgba(139,195,74,.08);}
.fm-card .em{font-size:42px;display:block;margin-bottom:7px;}
.fm-card .nm{font-size:14px;font-weight:700;color:#fff;}
.fm-card .pr{font-size:12px;color:#8BC34A;font-weight:700;margin-top:4px;}
.fm-card .in{font-size:10.5px;color:rgba(255,255,255,.4);margin-top:2px;}
.fm-card .cnt{
  display:inline-block;margin-top:7px;padding:3px 10px;border-radius:20px;
  background:rgba(139,195,74,.2);color:#8BC34A;
  font-size:11px;font-weight:800;
}

/* G'ildirak */
.wh-wrap{
  display:flex;flex-direction:column;align-items:center;
  padding:10px 16px 20px;
}
.wh-box{position:relative;width:280px;height:280px;margin-bottom:20px;}
.wh{
  width:100%;height:100%;border-radius:50%;
  border:6px solid #8BC34A;position:relative;overflow:hidden;
  box-shadow:0 0 34px rgba(139,195,74,.3),inset 0 0 30px rgba(0,0,0,.4);
  transition:transform 5.5s cubic-bezier(.15,.9,.25,1);
}
.wh-seg{
  position:absolute;width:50%;height:50%;
  top:0;left:50%;transform-origin:0% 100%;
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:16px;font-size:10px;font-weight:800;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.wh-arrow{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  width:0;height:0;z-index:5;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-top:26px solid #FFD54F;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));
}
.wh-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:62px;height:62px;border-radius:50%;z-index:4;
  background:linear-gradient(135deg,#8BC34A,#5A8F2B);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;box-shadow:0 3px 14px rgba(0,0,0,.4);
}
.wh-btn{
  width:100%;max-width:300px;padding:16px 0;border:none;border-radius:100px;
  background:linear-gradient(135deg,#8BC34A,#689F38);
  color:#0F1A0D;font-size:16px;font-weight:800;cursor:pointer;
  font-family:inherit;box-shadow:0 8px 26px rgba(139,195,74,.4);
}
.wh-btn:disabled{opacity:.4;}
.wh-cnt{
  font-size:12.5px;color:rgba(255,255,255,.5);margin-top:11px;
}

/* Yutuq oynasi */
.win-ov{
  position:fixed;inset:0;z-index:9700;background:rgba(0,0,0,.88);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 28px;text-align:center;
  animation:winIn .35s ease;
}
@keyframes winIn{from{opacity:0}to{opacity:1}}
.win-ov .em{
  font-size:80px;margin-bottom:18px;
  animation:winPop .8s cubic-bezier(.16,1.4,.3,1) both;
}
@keyframes winPop{
  0%{transform:scale(.2) rotate(-25deg);opacity:0}
  60%{transform:scale(1.2) rotate(6deg)}
  100%{transform:scale(1);opacity:1}
}
.win-ov h2{font-size:26px;font-weight:800;color:#FFD54F;margin-bottom:8px;}
.win-ov p{font-size:15px;color:rgba(255,255,255,.65);margin-bottom:26px;}
.win-ov button{
  padding:14px 40px;border:none;border-radius:100px;
  background:#8BC34A;color:#0F1A0D;font-size:15px;font-weight:800;
  cursor:pointer;font-family:inherit;
}

/* Reklama */
.ad-card{
  margin:0 16px 11px;padding:16px;border-radius:16px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;gap:13px;
}
.ad-card .em{font-size:28px;}
.ad-card .t{flex:1;}
.ad-card .t b{display:block;font-size:14px;font-weight:700;color:#fff;}
.ad-card .t span{font-size:12px;color:#8BC34A;font-weight:700;}
.ad-card button{
  padding:9px 16px;border:none;border-radius:11px;
  background:#8BC34A;color:#0F1A0D;font-size:12.5px;font-weight:800;
  cursor:pointer;font-family:inherit;
}
.ad-card button:disabled{opacity:.3;}
</style>

<body>

<div class="fm-top">
  <h1>🌾 Mening fermam</h1>
  <button class="fm-x" id="fmX">&times;</button>
</div>

<div class="fm-bal">
  <div class="lb">BALANS</div>
  <div class="sum" id="fmSum">0</div>
  <div class="cur">UYcoin</div>
</div>

<div class="coin-stats" id="coinStats">
  <div class="cs-i">
    <div class="cs-v" id="csJami">0</div>
    <div class="cs-l">Jami topilgan</div>

  <div class="cs-i">

  <div class="cs-i">
    <div class="cs-v" id="csOrin">-</div>

<div class="jamoa-box" id="jamoaBox">

<div class="fm-tabs">
  <button class="fm-tab" id="mnTab" style="background:linear-gradient(135deg,#FFD54F,#FFA000);color:#3E2723;border-color:#FFD54F;">⛏ Mayning</button>

  <button class="fm-tab" data-t="wheel">🎡 G'ildirak</button>

  <button class="fm-tab" data-t="reklama">📢 Reklama</button>
  <button class="fm-tab" data-t="sovrin">🎁 Sovrinlarim</button>
  <button class="fm-tab" id="chatTab">💬 Chat <span class="chat-tab-badge" id="chatTabBadge" hidden>0</span></button>
</div>

<div id="fmBody"><div class="load">Yuklanmoqda...</div></div>

<script src="core.js?v=1787986381"></script>
<script>
let FM = null, TAB = 'hayvon';

const EMOJI = {
  ari: '🐝', tovuq: '🐔', ordak: '🦆', echki: '🐐',
  qoy: '🐑', sigir: '🐄', ot: '🐎'
};

function boot(){
  const id = myId();
  if(!id){ el('fmBody').innerHTML = '<div class="load">Kirish kerak</div>'; return; }

  api('/api/ferma?tg_id=' + id + '&t=' + Date.now()).then(function(d){
    if(!d.ok){ el('fmBody').innerHTML = '<div class="load">Xato</div>'; return; }
    FM = d;
    draw();
    kunlikBonus();
  }).catch(function(){
    el('fmBody').innerHTML = '<div class="load">Server xatosi</div>';
  });
}

function draw(){
  el('fmSum').textContent = fmt(FM.balans || 0);
  el('fmYig').textContent = '+' + fmt(FM.yigilgan || 0);
  el('fmSoat').textContent = 'soatiga ' + fmt(FM.soatlik || 0) + ' UYcoin';

  const g = el('fmGet');
  g.disabled = !(FM.yigilgan > 0);

  if(TAB === 'hayvon') drawHayvon();
  else if(TAB === 'wheel') drawWheel();
  else if(TAB === 'wheel2') drawWheel2();
  else if(TAB === 'sovrin') drawSovrin();
  else drawReklama();
}

function drawHayvon(){
  const bor = {};
  (FM.hayvonlar || []).forEach(function(a){ bor[a.tur] = a.soni; });

  const list = Object.keys(FM.narxlar || {});
  el('fmBody').innerHTML = '<div class="fm-grid">' + list.map(function(k){
    const h = FM.narxlar[k];
    const n = bor[k] || 0;
    return '<div class="fm-card' + (n ? ' have' : '') + '" data-k="' + k + '">' +
      '<span class="em">' + (EMOJI[k] || '🐾') + '</span>' +
      '<div class="nm">' + esc(h.nom) + '</div>' +
      '<div class="pr">' + fmt(h.narx) + '</div>' +
      '<div class="in">soatiga ' + fmt(h.soat) + '</div>' +
      (n ? '<span class="cnt">' + n + ' ta</span>' : '') +
      '</div>';
  }).join('') + '</div>';

  document.querySelectorAll('.fm-card').forEach(function(c){
    c.addEventListener('click', function(){ sotibOl(c.dataset.k); });
  });
}

function drawWheel(){
  const segs = FM.gildirak || [];
  const n = segs.length;
  const ang = 360 / n;
  const R = 130, CX = 145, CY = 145;

  const RANG = ['#7CB342','#558B2F','#8BC34A','#689F38','#9CCC65',
                '#33691E','#AED581','#43A047','#66BB6A','#FFA000','#E65100'];

  // Sektorlarni SVG bilan chizamiz
  let paths = '';
  for(let i = 0; i < n; i++){
    const a1 = (i * ang - 90) * Math.PI / 180;
    const a2 = ((i + 1) * ang - 90) * Math.PI / 180;

    const x1 = CX + R * Math.cos(a1), y1 = CY + R * Math.sin(a1);
    const x2 = CX + R * Math.cos(a2), y2 = CY + R * Math.sin(a2);
    const big = ang > 180 ? 1 : 0;

    paths += '<path d="M' + CX + ' ' + CY + ' L' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
      ' A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + ' Z" ' +
      'fill="' + RANG[i % RANG.length] + '" stroke="rgba(0,0,0,.15)" stroke-width="1"/>';

    // Matn
    const am = ((i + 0.5) * ang - 90) * Math.PI / 180;
    const tr = R * 0.66;
    const tx = CX + tr * Math.cos(am), ty = CY + tr * Math.sin(am);
    const rot = (i + 0.5) * ang;

    const nom = segs[i].nom;
    const kichik = nom.length > 6;

    paths += '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" ' +
      'text-anchor="middle" dominant-baseline="middle" ' +
      'fill="#fff" font-size="' + (kichik ? 9 : 11) + '" font-weight="800" ' +
      'font-family="Manrope,sans-serif" ' +
      'transform="rotate(' + rot.toFixed(1) + ' ' + tx.toFixed(1) + ' ' + ty.toFixed(1) + ')" ' +
      'style="text-shadow:0 1px 3px rgba(0,0,0,.5)">' + esc(nom) + '</text>';
  }

  el('fmBody').innerHTML =
    '<div class="wh-wrap">' +
      '<div class="wh-box2">' +
        '<div class="wh-arrow2"></div>' +
        '<svg id="whEl" viewBox="0 0 290 290" class="wh-svg">' +
          '<circle cx="145" cy="145" r="136" fill="none" stroke="#8BC34A" stroke-width="7"/>' +
          paths +
          '<circle cx="145" cy="145" r="30" fill="#2D5016" stroke="#8BC34A" stroke-width="3"/>' +
          '<text x="145" y="145" text-anchor="middle" dominant-baseline="middle" ' +
          'font-size="26">\u{1F33E}</text>' +
        '</svg>' +
      '</div>' +

      ((FM.spin > 0 || FM.admin)
        ? '<button class="wh-btn" id="whGo">Aylantirish</button>' +
          '<div class="wh-cnt">Aylantirishlar: <b style="color:#8BC34A;">' +
          (FM.admin ? '\u221E' : FM.spin) + '</b></div>'
        : '<div class="no-spin">' +
            '<div class="e">\u{1F517}</div>' +
            '<b>Aylantirish tugadi</b>' +
            '<span>Do\u2018st taklif qiling \u2014 har biri uchun<br>' +
            '<b style="color:#8BC34A;">+1 aylantirish</b> va ' +
            '<b style="color:#8BC34A;">+5 000 ball</b></span>' +
            '<button class="wh-btn" id="whRef" style="margin-top:16px;">' +
            'Havolani ulashish</button>' +
            '<div class="wh-cnt">Ertaga yana 1 ta bepul aylantirish</div>' +
          '</div>') +
    '</div>';

  const b = el('whGo');
  if(b) b.addEventListener('click', spin);

  const rb = el('whRef');
  if(rb) rb.addEventListener('click', ulash);
}


function drawWheel2(){
  // Ochilmagan bo'lsa
  if(!FM.g2_ochiq){
    const bor = FM.ref_soni || 0;
    const kerak = FM.g2_kerak || 10;
    const foiz = Math.min(100, Math.round(bor / kerak * 100));

    el('fmBody').innerHTML =
      '<div class="wh-wrap">' +
        '<div class="lock-box">' +
          '<div class="e">\u{1F512}</div>' +
          '<b>Katta gildirak</b>' +
          '<span>iPhone, Samsung, ijara tolovi,<br>galichka va boshqa katta sovrinlar</span>' +

          '<div class="prog"><i style="width:' + foiz + '%"></i></div>' +
          '<div class="prog-t"><b>' + bor + '</b> / ' + kerak + ' referal</div>' +

          '<button class="wh-btn" id="w2Ref">Havolani ulashish</button>' +
          '<div class="wh-cnt">Ochilgach har <b style="color:#FFD54F;">5</b> referalga ' +
          '<b style="color:#FFD54F;">+1</b> aylantirish</div>' +
        '</div>' +
      '</div>';

    const rb = el('w2Ref');
    if(rb) rb.addEventListener('click', ulash);
    return;
  }

  const segs = FM.gildirak2 || [];
  const n = segs.length;
  const ang = 360 / n;
  const R = 130, CX = 145, CY = 145;

  const RANG = ['#FFB300','#F57C00','#FFA000','#EF6C00','#FFC107',
                '#E65100','#FFCA28','#D84315','#FFD54F','#BF360C',
                '#FFE082','#FF6F00','#FFECB3','#E64A19','#FFF3E0',
                '#FF8F00','#FFAB00','#C62828','#B71C1C'];

  let paths = '';
  for(let i = 0; i < n; i++){
    const a1 = (i * ang - 90) * Math.PI / 180;
    const a2 = ((i + 1) * ang - 90) * Math.PI / 180;
    const x1 = CX + R * Math.cos(a1), y1 = CY + R * Math.sin(a1);
    const x2 = CX + R * Math.cos(a2), y2 = CY + R * Math.sin(a2);

    paths += '<path d="M' + CX + ' ' + CY + ' L' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
      ' A' + R + ' ' + R + ' 0 0 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + ' Z" ' +
      'fill="' + RANG[i % RANG.length] + '" stroke="rgba(0,0,0,.2)" stroke-width="1"/>';

    const am = ((i + 0.5) * ang - 90) * Math.PI / 180;
    const tr = R * 0.68;
    const tx = CX + tr * Math.cos(am), ty = CY + tr * Math.sin(am);
    const rot = (i + 0.5) * ang;
    const nom = segs[i].nom;

    paths += '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" ' +
      'text-anchor="middle" dominant-baseline="middle" ' +
      'fill="#1A1A1A" font-size="' + (nom.length > 9 ? 6.5 : 8) + '" font-weight="800" ' +
      'font-family="Manrope,sans-serif" ' +
      'transform="rotate(' + rot.toFixed(1) + ' ' + tx.toFixed(1) + ' ' + ty.toFixed(1) + ')">' +
      esc(nom) + '</text>';
  }

  el('fmBody').innerHTML =
    '<div class="wh-wrap">' +
      '<div class="wh-box2">' +
        '<div class="wh-arrow2"></div>' +
        '<svg id="wh2El" viewBox="0 0 290 290" class="wh-svg gold">' +
          '<circle cx="145" cy="145" r="136" fill="none" stroke="#FFD54F" stroke-width="7"/>' +
          paths +
          '<circle cx="145" cy="145" r="30" fill="#5D4037" stroke="#FFD54F" stroke-width="3"/>' +
          '<text x="145" y="145" text-anchor="middle" dominant-baseline="middle" ' +
          'font-size="26">\u{1F3C6}</text>' +
        '</svg>' +
      '</div>' +

      ((FM.spin2 > 0 || FM.admin)
        ? '<button class="wh-btn gold" id="wh2Go">Aylantirish</button>' +
          '<div class="wh-cnt">Aylantirishlar: <b style="color:#FFD54F;">' +
          (FM.admin ? '\u221E' : FM.spin2) + '</b></div>'
        : '<div class="no-spin">' +
            '<div class="e">\u{1F517}</div>' +
            '<b>Aylantirish tugadi</b>' +
            '<span>Har <b style="color:#FFD54F;">5</b> ta yangi referal uchun<br>' +
            '<b style="color:#FFD54F;">+1 aylantirish</b></span>' +
            '<button class="wh-btn gold" id="wh2Ref" style="margin-top:16px;">' +
            'Havolani ulashish</button>' +
          '</div>') +
    '</div>';

  const b = el('wh2Go');
  if(b) b.addEventListener('click', spin2);

  const rb2 = el('wh2Ref');
  if(rb2) rb2.addEventListener('click', ulash);
}

function spin2(){
  const b = el('wh2Go');
  const w = el('wh2El');
  if(!b || !w) return;

  b.disabled = true;
  b.textContent = 'Aylanmoqda...';
  haptic('light');

  apiPost('/api/ferma-amal', { action: 'spin2' }).then(function(d){
    if(!d.ok){
      toast(d.error || 'Xato');
      b.disabled = false;
      b.textContent = 'Aylantirish';
      return;
    }

    const n = (FM.gildirak2 || []).length;
    const ang = 360 / n;
    const target = 360 * 7 + (360 - (d.index * ang) - ang / 2);

    w.style.transform = 'rotate(' + target + 'deg)';

    setTimeout(function(){
      showWin2(d);
      b.textContent = 'Aylantirish';
      boot();
    }, 5600);
  }).catch(function(){
    toast('Server xatosi');
    b.disabled = false;
    b.textContent = 'Aylantirish';
  });
}

function showWin2(d){
  if(d.tur === 'bosh'){ showLose(); return; }
  const EM = {
    ball: '\u{1F4B0}', chegirma: '\u{1F3F7}\uFE0F', reklama: '\u{1F4E2}',
    quti: '\u{1F381}', galichka: '\u2705', spin: '\u{1F3A1}',
    vip: '\u{1F451}', tepa: '\u2B06\uFE0F', ijara: '\u{1F3E0}',
    sovga: '\u{1F4F1}'
  };

  const IZOH = {
    ball: 'Balansingizga qoshildi',
    chegirma: 'Reklama sotib olishda ishlatiladi',
    reklama: 'Admin bogla nadi',
    quti: 'Balansingizga qoshildi',
    galichka: 'Profilingizda paydo boladi',
    spin: 'Asosiy gildirakka qoshildi',
    vip: 'Profilingiz oltin ramkada',
    tepa: 'Eloningiz tepada turadi',
    ijara: 'Tabriklaymiz! Admin bogla nadi',
    sovga: 'Tabriklaymiz! Admin bogla nadi'
  };

  const ov = document.createElement('div');
  ov.className = 'win-ov gold';
  ov.innerHTML =
    '<div class="em">' + (EM[d.tur] || '\u{1F389}') + '</div>' +
    '<h2>' + esc(d.nom) + '</h2>' +
    '<p>' + (IZOH[d.tur] || '') + '</p>' +
    '<button id="win2Ok">Zor!</button>';

  document.body.appendChild(ov);
  haptic('medium');

  el('win2Ok').addEventListener('click', function(){ ov.remove(); });
}


function drawSovrin(){
  el('fmBody').innerHTML = '<div class="load">Yuklanmoqda...</div>';

  api('/api/sovrinlarim?tg_id=' + myId() + '&t=' + Date.now()).then(function(d){
    const list = d.list || [];

    if(!list.length){
      el('fmBody').innerHTML =
        '<div class="empty" style="padding:60px 20px;">' +
        '<div class="ic">\u{1F381}</div><p>Sovrin yoq</p>' +
        '<span>Gildirakni aylantiring va yuting</span></div>';
      return;
    }

    const EM = {
      galichka: '\u2705', vip: '\u{1F451}', tepa: '\u2B06\uFE0F',
      reklama: '\u{1F4E2}', chegirma: '\u{1F3F7}\uFE0F',
      ijara: '\u{1F3E0}', sovga: '\u{1F4F1}'
    };

    el('fmBody').innerHTML = list.map(function(s){
      let muddat = '';
      if(s.tugash && s.tugash.length > 8){
        const dt = new Date(String(s.tugash).replace(' ', 'T'));
        if(!isNaN(dt)){
          const kun = Math.ceil((dt - new Date()) / 86400000);
          muddat = kun > 0 ? (kun + ' kun qoldi') : 'Muddati tugagan';
        }
      }

      return '<div class="sov-card">' +
        '<span class="em">' + (EM[s.tur] || '\u{1F381}') + '</span>' +
        '<div class="t"><b>' + esc(s.nom) + '</b>' +
        (muddat ? '<span>' + muddat + '</span>' : '<span>Faol</span>') +
        '</div>' +
        '<span class="ok">\u2713</span></div>';
    }).join('') + '<div style="height:20px;"></div>';
  }).catch(function(){
    el('fmBody').innerHTML = '<div class="load">Xato</div>';
  });
}

function drawReklama(){
  const r = FM.reklama || {};
  const EM = { lenta: '📱', storiy: '⭕', tepa: '⬆️', vip: '👑' };

  el('fmBody').innerHTML = Object.keys(r).map(function(k){
    const x = r[k];
    const yeta = (FM.balans || 0) >= x.narx;
    return '<div class="ad-card">' +
      '<span class="em">' + (EM[k] || '📢') + '</span>' +
      '<div class="t"><b>' + esc(x.nom) + '</b>' +
      '<span>' + fmt(x.narx) + ' UYcoin</span></div>' +
      '<button data-k="' + k + '"' + (yeta ? '' : ' disabled') + '>Olish</button>' +
      '</div>';
  }).join('') + '<div style="height:20px;"></div>';

  document.querySelectorAll('.ad-card button').forEach(function(b){
    b.addEventListener('click', function(){ reklamaOl(b.dataset.k); });
  });
}

function sotibOl(tur){
  const h = FM.narxlar[tur];
  if(!h) return;

  if((FM.balans || 0) < h.narx){
    toast('UYcoin yetarli emas');
    haptic('medium');
    return;
  }

  if(!confirm(h.nom + ' sotib olasizmi?\n\nNarxi: ' + fmt(h.narx) + ' UYcoin')) return;

  apiPost('/api/ferma-amal', { action: 'sotib', tur: tur }).then(function(d){
    if(d.ok){ haptic('medium'); toast(h.nom + ' qoshildi!'); boot(); }
    else toast(d.error || 'Xato');
  }).catch(function(){ toast('Server xatosi'); });
}

function reklamaOl(k){
  const x = FM.reklama[k];
  if(!x) return;
  if(!confirm(x.nom + '\n\n' + fmt(x.narx) + ' UYcoin sarflanadi')) return;

  apiPost('/api/ferma-amal', { action: 'reklama', tur: k }).then(function(d){
    if(d.ok){ haptic('medium'); toast('Buyurtma yuborildi! Admin bogla nadi'); boot(); }
    else toast(d.error || 'Xato');
  }).catch(function(){ toast('Server xatosi'); });
}

function spin(){
  const b = el('whGo');
  const w = el('whEl');
  if(!b || !w) return;

  b.disabled = true;
  b.textContent = 'Aylanmoqda...';
  haptic('light');

  apiPost('/api/ferma-amal', { action: 'spin' }).then(function(d){
    if(!d.ok){
      toast(d.error || 'Xato');
      b.disabled = false;
      b.textContent = 'Aylantirish';
      return;
    }

    const n = (FM.gildirak || []).length;
    const ang = 360 / n;
    const target = 360 * 6 + (360 - (d.index * ang) - ang / 2);

    w.style.transform = 'rotate(' + target + 'deg)';

    setTimeout(function(){
      showWin(d);
      b.textContent = 'Aylantirish';
      boot();
    }, 5600);
  }).catch(function(){
    toast('Server xatosi');
    b.disabled = false;
    b.textContent = 'Aylantirish';
  });
}


function showLose(){
  const ov = document.createElement('div');
  ov.className = 'win-ov lose';
  ov.innerHTML =
    '<div class="em">\u{1F340}</div>' +
    '<h2>Bu safar omad kulmadi</h2>' +
    '<p>Qayta urinib koring \u2014<br>keyingi safar sizniki boladi!</p>' +
    '<button id="loseOk">Yana urinish</button>';

  document.body.appendChild(ov);
  try {
    if(TG && TG.HapticFeedback) TG.HapticFeedback.notificationOccurred('warning');
  } catch(e){}

  el('loseOk').addEventListener('click', function(){ ov.remove(); });
}

function showWin(d){
  if(d.tur === 'bosh'){ showLose(); return; }
  const EM = { ball: '💰', hayvon: '🐾', sovga: '🎁' };

  const ov = document.createElement('div');
  ov.className = 'win-ov';
  ov.innerHTML =
    '<div class="em">' + (EM[d.tur] || '🎉') + '</div>' +
    '<h2>' + esc(d.nom) + '</h2>' +
    '<p>' + (d.tur === 'sovga'
      ? 'Tabriklaymiz! Admin siz bilan boglanadi'
      : (d.tur === 'hayvon' ? 'Fermangizga qoshildi' : 'Balansingizga qoshildi')) + '</p>' +
    '<button id="winOk">Zor!</button>';

  document.body.appendChild(ov);
  haptic('medium');

  el('winOk').addEventListener('click', function(){ ov.remove(); });
}

function kunlikBonus(){
  apiPost('/api/ferma-amal', { action: 'kunlik' }).then(function(d){
    if(!d.ok) return;

    let msg = '+' + fmt(d.miqdor) + ' UYcoin';
    if(d.bonus) msg += ' va +' + fmt(d.bonus) + ' haftalik bonus!';

    toast('Kunlik bonus: ' + msg);
    haptic('medium');
    setTimeout(boot, 1200);
  }).catch(function(){});
}


function ulash(){
  const id = myId();
  if(!id) return;

  const link = 'https://t.me/Ijaraga_uybot?start=ref_' + id;
  const text = 'UYgram \u2014 Namangandagi eng qulay kochmas mulk platformasi!\n\n' +
    'Menga qoshiling va fermangizni boshlang \u{1F33E}';

  const url = 'https://t.me/share/url?url=' + encodeURIComponent(link) +
    '&text=' + encodeURIComponent(text);

  haptic('light');
  if(TG && TG.openTelegramLink) TG.openTelegramLink(url);
  else window.open(url, '_blank');
}

document.addEventListener('DOMContentLoaded', function(){
  el('fmX').addEventListener('click', function(){ location.href = 'xaridor.html'; });

  el('fmGet').addEventListener('click', function(){
    apiPost('/api/ferma-amal', { action: 'yigish' }).then(function(d){
      if(d.ok){

        toast('+' + fmt(d.miqdor) + ' UYcoin');
        boot();
      } else toast(d.error || 'Xato');
    }).catch(function(){ toast('Server xatosi'); });
  });

  const mt = el('mnTab');
  if(mt) mt.addEventListener('click', function(){
    haptic('light');
    location.href = 'mayning.html';
  });

  document.querySelectorAll('.fm-tab[data-t]').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.fm-tab[data-t]').forEach(function(x){ x.classList.remove('on'); });
      t.classList.add('on');
      TAB = t.dataset.t;
      haptic('light');
      draw();
    });
  });

  setTimeout(boot, 400);
});
