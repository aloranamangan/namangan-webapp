<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayt sozlamalari</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#F5F5F0;font-family:'Manrope',sans-serif;
  padding:0 0 40px;line-height:1.6}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  background:linear-gradient(180deg,rgba(0,0,0,.96),transparent);
  backdrop-filter:blur(14px)}
.top button{width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(255,255,255,.12);color:#fff;font-size:19px;cursor:pointer}
.top h1{font-size:18px;font-weight:800}
.box{margin:8px 14px 18px;padding:18px;border-radius:16px;
  background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.22)}
.box h2{font-size:13.5px;font-weight:800;color:#F0C868;margin-bottom:4px}
.box p{font-size:11.5px;color:#9A9A90;margin-bottom:16px}
label{display:block;font-size:11.5px;color:#9A9A90;margin:12px 0 5px;font-weight:700}
input{width:100%;padding:12px 14px;border-radius:11px;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);
  color:#F5F5F0;font-family:inherit;font-size:13px;outline:none}
input:focus{border-color:rgba(212,175,55,.5)}
.btn{width:100%;padding:14px;border-radius:13px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#F0C868,#D4AF37);color:#12100A;
  font-family:inherit;font-size:14px;font-weight:800;margin-top:20px}
.btn:disabled{opacity:.55}
.msg{text-align:center;font-size:12.5px;margin-top:12px;min-height:1.4em}
</style>
</head>
<body>

<div class="top">
  <button onclick="history.length>1?history.back():location.href='zaxira.html'">&#8592;</button>
  <h1>&#127760; Sayt sozlamalari</h1>
</div>

<div class="box">
  <h2>Ijtimoiy tarmoqlar</h2>
  <p>To'liq havola yozing. Bo'sh qoldirilsa saytda ko'rinmaydi.</p>

  <label>Telegram</label>
  <input id="f_telegram" placeholder="https://t.me/ALORA_NAMANGAN">
  <label>Instagram</label>
  <input id="f_instagram" placeholder="https://instagram.com/...">
  <label>YouTube</label>
  <input id="f_youtube" placeholder="https://youtube.com/@...">
  <label>TikTok</label>
  <input id="f_tiktok" placeholder="https://tiktok.com/@...">
  <label>Facebook</label>
  <input id="f_facebook" placeholder="https://facebook.com/...">

  <button class="btn" id="save">Saqlash</button>
  <div class="msg" id="msg"></div>
</div>

<div class="box">
  <h2>Aloqa</h2>
  <p>Saytning pastida ko'rsatiladi.</p>
  <label>Telefon 1</label>
  <input id="f_tel1" placeholder="+998 94 501 18 18">
  <label>Telefon 2</label>
  <input id="f_tel2" placeholder="+998 50 977 76 76">
  <label>Manzil</label>
  <input id="f_manzil" placeholder="Namangan shahri">
  <button class="btn" id="save2">Saqlash</button>
  <div class="msg" id="msg2"></div>
</div>

<script>
var API = 'https://api.namangan-ijara.uz';
var KEYS = ['telegram','instagram','youtube','tiktok','facebook','tel1','tel2','manzil'];

function idata(){
  try { return (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || ''; }
  catch(e){ return ''; }
}
function tok(){
  try { return localStorage.getItem('ni_token') || ''; } catch(e){ return ''; }
}

fetch(API + '/api/sayt').then(function(r){ return r.json(); })
  .then(function(d){
    if(!d || !d.ok) return;
    var s = d.sozlama || {};
    KEYS.forEach(function(k){
      var e = document.getElementById('f_' + k);
      if(e && s[k]) e.value = s[k];
    });
  }).catch(function(){});

function saqla(btnId, msgId){
  var b = document.getElementById(btnId);
  var m = document.getElementById(msgId);
  b.disabled = true;
  m.textContent = 'Saqlanmoqda...';
  m.style.color = '#9A9A90';

  var body = { init_data: idata(), token: tok() };
  KEYS.forEach(function(k){
    var e = document.getElementById('f_' + k);
    if(e) body[k] = e.value.trim();
  });

  fetch(API + '/api/sayt-saqlash', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); }).then(function(d){
    b.disabled = false;
    if(d && d.ok){ m.textContent = 'Saqlandi'; m.style.color = '#5BBF6A'; }
    else { m.textContent = 'Kirish cheklangan'; m.style.color = '#E8433D'; }
  }).catch(function(){
    b.disabled = false;
    m.textContent = 'Server xatosi';
    m.style.color = '#E8433D';
  });
}

document.getElementById('save').onclick = function(){ saqla('save','msg'); };
document.getElementById('save2').onclick = function(){ saqla('save2','msg2'); };

try { if(window.Telegram && Telegram.WebApp) Telegram.WebApp.expand(); } catch(e){}
</script>
</body>
</html>
