<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kanallar</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
#root{padding:0 16px 110px;}
.slot{
  margin-bottom:12px;padding:14px;border-radius:16px;
  background:#121212;border:1px solid var(--line);
}
.slot.filled{border-color:rgba(46,204,113,.35);background:rgba(46,204,113,.04);}
.slot-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.slot-n{
  width:26px;height:26px;border-radius:8px;background:#1e1e1e;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--muted);flex-shrink:0;
}
.slot.filled .slot-n{background:rgba(46,204,113,.16);color:#2ECC71;}
.slot-kd{display:flex;gap:6px;flex:1;}
.skd{
  flex:1;padding:7px 0;border-radius:9px;background:#1a1a1a;
  border:1px solid var(--line);color:#8E8E8E;cursor:pointer;
  font-family:inherit;font-size:11px;font-weight:700;
}
.skd.on{background:#0095F6;border-color:#0095F6;color:#fff;}
.slot-del{
  width:28px;height:28px;border-radius:8px;border:none;
  background:rgba(237,73,86,.14);color:#ED4956;font-size:15px;cursor:pointer;
  flex-shrink:0;
}
.slot .inp{margin-bottom:9px !important;padding:12px 14px !important;font-size:14px !important;}
.slot .inp:last-of-type{margin-bottom:0 !important;}
.slot-st{
  display:flex;gap:14px;margin-top:11px;padding-top:11px;
  border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;
}
.slot-st span{color:var(--muted);}
.slot-st b{color:#fff;font-weight:800;}
.slot-st .pct{margin-left:auto;color:#2ECC71;font-weight:800;}
.save-all{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:16px;right:16px;
  z-index:200;padding:16px 0;border:none;border-radius:15px;
  background:#0095F6;color:#fff;font-size:15px;font-weight:800;
  cursor:pointer;font-family:inherit;box-shadow:0 6px 22px rgba(0,149,246,.4);
}
.hint{margin:0 16px 16px;padding:14px;border-radius:14px;
  background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.28);
  font-size:12.5px;color:#FFC107;line-height:1.55;}
.bk{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;padding:12px 20px;}
</style>
</head>
<body>

<header class="topbar" style="display:flex;align-items:center;gap:12px;">
  <h1 style="flex:1;">📣 Kanallar <span id="chCnt" style="font-size:13px;opacity:.5;"></span></h1>
  <button id="kx" style="width:36px;height:36px;border-radius:50%;border:none;
    background:rgba(255,255,255,.7);color:#0d1626;font-size:20px;cursor:pointer;">&times;</button>
</header>

<button class="bk" id="bk">← Boshqaruv markazi</button>

<div class="hint">
  ⚠️ Kanal va guruh uchun bot u yerda <b>administrator</b> bo'lishi shart.
  Bot uchun obuna tekshirilmaydi — faqat havola ko'rsatiladi.
</div>

<div id="root"><div class="load">Yuklanmoqda...</div></div>
<button class="save-all" id="saveAll">Saqlash</button>

<script src="i18n.js?v=1786724767"></script>
<script src="core2.js"></script>
<script>
const SLOTS = 10;
let DATA = [];

function boot(){
  const q = '/api/kanallar?admin=1&init_data=' + encodeURIComponent(initData()) +
    ((typeof APP_TOKEN !== 'undefined' && APP_TOKEN) ? '&token=' + encodeURIComponent(APP_TOKEN) : '');

  api(q).then(function(d){
    if(!d.ok){
      el('root').innerHTML = '<div class="empty"><div class="ic">&#128274;</div><p>Kirish cheklangan</p></div>';
      el('saveAll').style.display = 'none';
      return;
    }
    DATA = d.channels || [];
    draw();
  }).catch(function(){ el('root').innerHTML = '<div class="load">Xato yuz berdi</div>'; });
}

function draw(){
  let html = '';
  for(let i = 0; i < SLOTS; i++){
    const c = DATA[i] || null;
    const k = c ? (c.kind || 'channel') : 'channel';

    html += '<div class="slot' + (c ? ' filled' : '') + '" data-i="' + i + '"' +
      (c ? ' data-id="' + c.id + '"' : '') + '>' +
      '<div class="slot-hd">' +
        '<div class="slot-n">' + (i + 1) + '</div>' +
        '<div class="slot-kd">' +
          '<button class="skd' + (k === 'channel' ? ' on' : '') + '" data-k="channel">Kanal</button>' +
          '<button class="skd' + (k === 'group' ? ' on' : '') + '" data-k="group">Guruh</button>' +
          '<button class="skd' + (k === 'bot' ? ' on' : '') + '" data-k="bot">Bot</button>' +
        '</div>' +
        (c ? '<button class="slot-del">&times;</button>' : '') +
      '</div>' +
      '<input class="inp s-name" placeholder="Nomi (masalan: Namangan uylar)" value="' +
        (c ? esc(c.title) : '') + '">' +
      '<input class="inp s-link" placeholder="@manzil yoki https://t.me/..." value="' +
        (c ? esc(c.chat_id) : '') + '">' +
      (c && c.stats
        ? '<div class="slot-st">' +
          '<span>&#128065; Kordi: <b>' + fmt(c.stats.seen) + '</b></span>' +
          '<span>&#9989; Azo: <b>' + fmt(c.stats.joined) + '</b></span>' +
          '<span class="pct">' +
            (c.stats.seen ? Math.round(c.stats.joined / c.stats.seen * 100) : 0) + '%</span>' +
          '</div>'
        : '') +
      '</div>';
  }

  el('root').innerHTML = html;

  document.querySelectorAll('.skd').forEach(function(b){
    b.addEventListener('click', function(){
      const p = b.closest('.slot-kd');
      p.querySelectorAll('.skd').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      haptic('light');
    });
  });

  document.querySelectorAll('.slot-del').forEach(function(b){
    b.addEventListener('click', function(){
      const s = b.closest('.slot');
      const id = s.dataset.id;
      if(!id) return;
      if(!confirm('Ochirasizmi?')) return;
      apiPost('/api/kanal-amal', { action: 'delete', id: parseInt(id) })
        .then(function(d){ if(d.ok){ toast('Ochirildi'); boot(); } });
    });
  });
}

function saveAll(){
  const slots = document.querySelectorAll('.slot');
  const jobs = [];

  slots.forEach(function(s){
    const nm = s.querySelector('.s-name').value.trim();
    const lk = s.querySelector('.s-link').value.trim();
    const kd = s.querySelector('.skd.on').dataset.k;
    const id = s.dataset.id;

    if(!lk) return;
    if(id) return;

    jobs.push({ chat_id: lk, title: nm, kind: kd });
  });

  if(!jobs.length){ toast('Yangi malumot yoq'); return; }

  const b = el('saveAll');
  b.disabled = true;
  b.textContent = 'Saqlanmoqda...';

  let done = 0, errs = [];

  function next(){
    if(done >= jobs.length){
      b.disabled = false;
      b.textContent = 'Saqlash';
      if(errs.length) toast('Xato: ' + errs[0]);
      else { haptic('medium'); toast('Saqlandi'); }
      boot();
      return;
    }
    const j = jobs[done++];
    apiPost('/api/kanal-amal', {
      action: 'add', chat_id: j.chat_id, title: j.title, kind: j.kind
    }).then(function(d){
      if(!d.ok) errs.push(d.error || j.chat_id);
      next();
    }).catch(function(){ errs.push(j.chat_id); next(); });
  }

  next();
}

document.addEventListener('DOMContentLoaded', function(){
  el('saveAll').addEventListener('click', saveAll);
  el('bk').addEventListener('click', function(){ location.href = 'zaxira.html'; });
  el('kx').addEventListener('click', function(){
    let last = null;
    try { last = localStorage.getItem('ni_admin_panel'); } catch(e){}
    location.href = (last && last !== 'zaxira.html') ? last : 'xaridor.html';
  });
  setTimeout(function(){
    if(typeof checkSession === 'function') checkSession(function(){ boot(); });
    else boot();
  }, 400);
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof loadAdminState === 'function') loadAdminState();
  }, 500);
});
</script>
</body>
</html>
