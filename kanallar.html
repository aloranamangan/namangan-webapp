<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kanallar</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
.ch{margin:0 16px 12px;padding:16px;border-radius:18px;
  background:#121212;border:1px solid var(--line);}
.ch.off{opacity:.45;}
.ch-top{display:flex;align-items:center;gap:12px;}
.ch-ic{width:46px;height:46px;border-radius:50%;background:rgba(0,149,246,.14);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.ch-in{flex:1;min-width:0;}
.ch-in b{display:block;font-size:15px;font-weight:700;}
.ch-in span{font-size:12px;color:var(--muted);word-break:break-all;}
.ch-bt{display:flex;gap:8px;margin-top:13px;}
.ch-bt button{flex:1;padding:10px 0;border:none;border-radius:11px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:20px;z-index:100;
  width:56px;height:56px;border-radius:50%;border:none;background:#0095F6;
  color:#fff;font-size:26px;cursor:pointer;box-shadow:0 6px 20px rgba(0,149,246,.45);}
.hint{margin:0 16px 16px;padding:15px;border-radius:15px;
  background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.28);
  font-size:12.5px;color:#FFC107;line-height:1.55;}
.kd-row{display:flex;gap:8px;margin-bottom:18px;}
.kd{flex:1;padding:13px 6px;border-radius:12px;background:#141414;
  border:1px solid var(--line);color:#fff;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:700;text-align:center;}
.kd.on{background:#0095F6;border-color:#0095F6;}
.kd .e{display:block;font-size:20px;margin-bottom:4px;}
.ch-kind{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;
  border-radius:5px;margin-left:6px;background:rgba(255,255,255,.1);color:#aaa;}
.bk{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;padding:12px 20px;}
</style>
</head>
<body>

<header class="topbar" style="display:flex;align-items:center;gap:12px;">
  <h1 style="flex:1;">📣 Kanallar <span id="chCnt" style="font-size:13px;opacity:.5;"></span></h1>
  <button id="kx" style="width:36px;height:36px;border-radius:50%;border:none;
    background:rgba(255,255,255,.7);color:#0d1626;font-size:20px;cursor:pointer;">&times;</button>
</header>

<button class="bk" id="bk">← Boshqaruv markazi</button>

<div class="hint">
  ⚠️ Kanal qo'shishdan oldin botni o'sha kanalga <b>administrator</b> qilib qo'shing.
  Aks holda obunani tekshirib bo'lmaydi.
</div>

<div id="root"><div class="load">Yuklanmoqda...</div></div>
<button class="fab" id="fab">+</button>

<script src="core.js"></script>
<script>
let CH = [];

function kindName(k){
  if(k === 'bot') return 'BOT';
  if(k === 'group') return 'GURUH';
  return 'KANAL';
}

function kindIcon(k){
  if(k === 'bot') return '\u{1F916}';
  if(k === 'group') return '\u{1F465}';
  return '\u{1F4E2}';
}

function boot(){
  const q = '/api/kanallar?admin=1&init_data=' + encodeURIComponent(initData()) +
    ((typeof APP_TOKEN !== 'undefined' && APP_TOKEN) ? '&token=' + encodeURIComponent(APP_TOKEN) : '');

  api(q).then(function(d){
    if(!d.ok){
      el('root').innerHTML = '<div class="empty"><div class="ic">&#128274;</div><p>Kirish cheklangan</p></div>';
      el('fab').style.display = 'none';
      return;
    }
    CH = d.channels || [];
    draw();
  }).catch(function(){ el('root').innerHTML = '<div class="load">Xato yuz berdi</div>'; });
}

function draw(){
  const cc = el('chCnt');
  if(cc) cc.textContent = CH.length + '/10';

  if(!CH.length){
    el('root').innerHTML = '<div class="empty" style="padding:60px 20px;">' +
      '<div class="ic">&#128227;</div><p>Kanal qoshilmagan</p>' +
      '<span>Majburiy obuna uchun kanal qoshing</span></div>';
    return;
  }

  el('root').innerHTML = CH.map(function(c){
    return '<div class="ch' + (c.active ? '' : ' off') + '">' +
      '<div class="ch-top"><div class="ch-ic">' + kindIcon(c.kind) + '</div>' +
      '<div class="ch-in"><b>' + esc(c.title) +
      '<span class="ch-kind">' + kindName(c.kind) + '</span></b>' +
      '<span>' + esc(c.chat_id) + '</span></div></div>' +
      '<div class="ch-bt">' +
      '<button style="background:#262626;color:#fff;" data-a="' +
        (c.active ? 'off' : 'on') + '" data-id="' + c.id + '">' +
        (c.active ? 'Toxtatish' : 'Yoqish') + '</button>' +
      '<button style="background:rgba(237,73,86,.16);color:#ED4956;" data-a="delete" data-id="' +
        c.id + '">Ochirish</button>' +
      '</div></div>';
  }).join('') + '<div style="height:90px;"></div>';

  document.querySelectorAll('.ch-bt button').forEach(function(b){
    b.addEventListener('click', function(){
      const a = b.dataset.a;
      if(a === 'delete' && !confirm('Kanalni ochirasizmi?')) return;
      apiPost('/api/kanal-amal', { action: a, id: parseInt(b.dataset.id) })
        .then(function(d){ if(d.ok){ toast('Bajarildi'); boot(); } });
    });
  });
}

function newCh(){
  if(CH.length >= 10){ toast('Maksimum 10 ta qoshish mumkin'); return; }

  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" id="ncS"><div class="sheet-bar"></div>' +
    '<div class="sheet-title">Kanal yoki guruh qoshish</div><div class="wrap">' +
    '<label class="label">Turi</label>' +
    '<div class="kd-row">' +
      '<button class="kd on" data-k="channel"><span class="e">&#128227;</span>Kanal</button>' +
      '<button class="kd" data-k="group"><span class="e">&#128101;</span>Guruh</button>' +
      '<button class="kd" data-k="bot"><span class="e">&#129302;</span>Bot</button>' +
    '</div>' +
    '<label class="label">Manzil</label>' +
    '<input class="inp" id="ncU" placeholder="@kanal_nomi yoki @guruh_nomi">' +
    '<label class="label">Korinadigan nom (ixtiyoriy)</label>' +
    '<input class="inp" id="ncN" placeholder="Namangan Ijara rasmiy">' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.5;">' +
    'Nom kiritilmasa — kanalning oz nomi olinadi.<br>' +
    'Bot u yerda <b>admin</b> bolishi shart.<br>' +
    'Jami <b>' + CH.length + '/10</b> ta qoshilgan.</div>' +
    '<button class="btn" id="ncGo">Tekshirish va qoshish</button></div></div>';

  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
  el('ncS').addEventListener('click', function(e){ e.stopPropagation(); });

  let kind = 'channel';
  bg.querySelectorAll('.kd').forEach(function(k){
    k.addEventListener('click', function(){
      bg.querySelectorAll('.kd').forEach(function(x){ x.classList.remove('on'); });
      k.classList.add('on');
      kind = k.dataset.k;
      haptic('light');
      const hint = bg.querySelector('#ncHint');
      if(hint) hint.innerHTML = kind === 'bot'
        ? 'Bot uchun obuna tekshirilmaydi — faqat havola korsatiladi.'
        : 'Bot u yerda <b>admin</b> bolishi shart.';
    });
  });

  el('ncGo').addEventListener('click', function(){
    const u = el('ncU').value.trim();
    if(!u){ toast('Kanal manzilini kiriting'); return; }

    const b = el('ncGo');
    b.disabled = true;
    b.textContent = 'Tekshirilmoqda...';

    apiPost('/api/kanal-amal', {
      action: 'add', chat_id: u, title: el('ncN').value.trim(), kind: kind
    }).then(function(d){
      if(d.ok){ haptic('medium'); toast('Qoshildi: ' + (d.title || '')); bg.remove(); boot(); }
      else { toast(d.error || 'Xato'); b.disabled = false; b.textContent = 'Tekshirish va qoshish'; }
    }).catch(function(){
      toast('Server xatosi'); b.disabled = false; b.textContent = 'Tekshirish va qoshish';
    });
  });
}

document.addEventListener('DOMContentLoaded', function(){
  el('fab').addEventListener('click', newCh);
  el('bk').addEventListener('click', function(){ location.href = 'zaxira.html'; });
  el('kx').addEventListener('click', function(){
    let last = null;
    try { last = localStorage.getItem('ni_admin_panel'); } catch(e){}
    location.href = (last && last !== 'zaxira.html') ? last : 'sotuvchi.html';
  });
  setTimeout(function(){
    if(typeof checkSession === 'function') checkSession(function(){ boot(); });
    else boot();
  }, 400);
});
</script>
</body>
</html>
