<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Xarita</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Manrope',sans-serif;background:#000;color:#fff;overflow:hidden;}
#map{position:fixed;inset:0;z-index:1;}
.leaflet-container{background:#0d1117;}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:400;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);
  display:flex;align-items:center;gap:12px;
}
.topbar h1{font-size:19px;font-weight:800;flex:1;}
.tb-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
  background:rgba(20,20,25,.75);backdrop-filter:blur(14px);
  color:#fff;font-size:16px;cursor:pointer;
}
.filters{
  position:fixed;top:calc(66px + env(safe-area-inset-top));left:0;right:0;z-index:400;
  display:flex;gap:8px;padding:0 16px;overflow-x:auto;scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none;}
.fl{
  flex-shrink:0;padding:9px 16px;border-radius:100px;cursor:pointer;
  background:rgba(20,20,25,.85);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.16);color:#fff;
  font-size:13px;font-weight:700;font-family:inherit;white-space:nowrap;
}
.fl.on{background:#fff;color:#000;border-color:#fff;}
.pin{background:none;border:none;}
.pin-in{
  padding:6px 11px;border-radius:100px;font-size:13px;font-weight:800;
  color:#fff;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5);
  border:2px solid rgba(255,255,255,.85);transform:translate(-50%,-50%);
  position:relative;
}
.pin-in.sell{background:linear-gradient(135deg,#2ECC71,#27AE60);}
.pin-in.rent{background:linear-gradient(135deg,#F39C12,#E67E22);}
.pin-in::after{
  content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:rgba(255,255,255,.85);
}
.card{
  position:fixed;bottom:0;left:0;right:0;z-index:500;
  background:#121212;border-radius:22px 22px 0 0;
  padding:12px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 -8px 34px rgba(0,0,0,.6);
}
.card.on{transform:none;}
.card-bar{width:40px;height:4px;border-radius:3px;background:#333;margin:0 auto 14px;}
.card-row{display:flex;gap:13px;}
.card-img{width:100px;height:100px;border-radius:14px;object-fit:cover;flex-shrink:0;background:#222;}
.card-info{flex:1;min-width:0;}
.card-tag{
  display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;
  padding:3px 9px;border-radius:5px;margin-bottom:6px;
}
.card-tag.sell{background:rgba(46,204,113,.18);color:#2ECC71;}
.card-tag.rent{background:rgba(243,156,18,.18);color:#F39C12;}
.card-price{font-size:19px;font-weight:800;margin-bottom:4px;}
.card-desc{font-size:13px;color:#aaa;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-user{font-size:12px;color:#0095F6;font-weight:700;margin-top:6px;}
.card-btns{display:flex;gap:9px;margin-top:14px;}
.card-btns button{
  flex:1;padding:12px 0;border:none;border-radius:12px;
  font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
.b-blue{background:#0095F6;color:#fff;}
.b-gray{background:#262626;color:#fff;}
.count{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:16px;z-index:400;
  padding:10px 16px;border-radius:100px;background:rgba(20,20,25,.85);
  backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);
  font-size:12.5px;font-weight:700;
}
.locbtn{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:16px;z-index:400;
  width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
  background:rgba(20,20,25,.85);backdrop-filter:blur(14px);color:#fff;
  font-size:19px;cursor:pointer;
}
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <h1>🗺 Xarita</h1>
  <button class="tb-btn" id="layer">🌓</button>
</div>

<div class="filters">
  <button class="fl on" data-f="all">Hammasi</button>
  <button class="fl" data-f="sell">Sotiladi</button>
  <button class="fl" data-f="rent">Ijaraga</button>
</div>

<div class="count" id="cnt">Yuklanmoqda...</div>
<button class="locbtn" id="loc">📍</button>

<div class="card" id="card">
  <div class="card-bar"></div>
  <div class="card-row">
    <img class="card-img" id="cImg">
    <div class="card-info">
      <span class="card-tag" id="cTag">Sotiladi</span>
      <div class="card-price" id="cPrice"></div>
      <div class="card-desc" id="cDesc"></div>
      <div class="card-user" id="cUser"></div>
    </div>
  </div>
  <div class="card-btns">
    <button class="b-blue" id="cOpen">Batafsil</button>
    <button class="b-gray" id="cClose">Yopish</button>
  </div>
</div>

<script src="i18n.js"></script>
<script src="core.js?v=1786712286"></script>
<script>

let map, markers = [], filter = 'all', dark = true, POSTS = [];

const DARK = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
const LIGHT = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
let tile;

function shortPrice(p){
  const s = String(p || '').replace(/[^0-9.]/g, '');
  const n = parseFloat(s);
  if(!isFinite(n) || !n) return '?';
  if(n >= 1000000000) return (n/1000000000).toFixed(1).replace('.0','') + 'B';
  if(n >= 1000000) return Math.round(n/1000000) + 'M';
  if(n >= 1000) return Math.round(n/1000) + 'K';
  return String(Math.round(n));
}

function init(){
  map = L.map('map', { zoomControl: false, attributionControl: false })
    .setView([40.9983, 71.6726], 13);
  tile = L.tileLayer(DARK, { maxZoom: 19 }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  load();
}

function load(){
  fetch(API + '/api/xarita')
    .then(function(r){ return r.json(); })
    .then(function(d){
      POSTS = (d.posts || []).map(function(p){
        const lines = String(p.description || '').split('\n');
        const head = lines[0] || '';
        const type = head.indexOf('Ijaraga') === 0 ? 'rent' : 'sell';
        return {
          id: p.id, lat: p.lat, lng: p.lng, type: type,
          price: p.price || '', short: shortPrice(p.price),
          desc: lines.slice(1).join(' ') || head,
          user: '@' + (p.username || ''),
          img: p.file_id ? (API + '/media/' + p.file_id) : ''
        };
      });
      draw();
    })
    .catch(function(){ el('cnt').textContent = 'Xato yuz berdi'; });
}

function draw(){
  markers.forEach(function(m){ map.removeLayer(m); });
  markers = [];

  const list = POSTS.filter(function(p){ return filter === 'all' || p.type === filter; });

  list.forEach(function(p){
    const ic = L.divIcon({
      className: 'pin',
      html: '<div class="pin-in ' + p.type + '">' + p.short + '</div>',
      iconSize: [0, 0]
    });
    const m = L.marker([p.lat, p.lng], { icon: ic }).addTo(map);
    m.on('click', function(){ show(p); });
    markers.push(m);
  });

  el('cnt').textContent = list.length + " ta e'lon";

  if(list.length && filter === 'all'){
    try {
      const g = L.featureGroup(markers);
      map.fitBounds(g.getBounds(), { padding: [60, 60], maxZoom: 15 });
    } catch(e){}
  }
}

function show(p){
  el('cImg').src = p.img;
  el('cTag').textContent = p.type === 'sell' ? 'Sotiladi' : 'Ijaraga beriladi';
  el('cTag').className = 'card-tag ' + p.type;
  el('cPrice').textContent = p.price;
  el('cDesc').textContent = p.desc;
  el('cUser').textContent = p.user;
  el('card').classList.add('on');
  el('cOpen').onclick = function(){
    location.href = 'xaridor.html';
  };
  map.panTo([p.lat, p.lng], { animate: true });
}

document.addEventListener('DOMContentLoaded', function(){
  init();

  document.querySelectorAll('.fl').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.fl').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      filter = b.dataset.f;
      draw();
      el('card').classList.remove('on');
    });
  });

  el('cClose').addEventListener('click', function(){ el('card').classList.remove('on'); });

  el('layer').addEventListener('click', function(){
    dark = !dark;
    map.removeLayer(tile);
    tile = L.tileLayer(dark ? DARK : LIGHT, { maxZoom: 19 }).addTo(map);
  });

  el('loc').addEventListener('click', function(){
    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function(pos){
      map.setView([pos.coords.latitude, pos.coords.longitude], 15);
      L.circleMarker([pos.coords.latitude, pos.coords.longitude], {
        radius: 8, color: '#fff', weight: 3, fillColor: '#0095F6', fillOpacity: 1
      }).addTo(map);
    });
  });
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof myId !== 'function' || !IS_ADMIN) return;
    if(typeof isApk === 'function' && !isApk()) return;

    const t = document.querySelector('.topbar h1') || document.querySelector('h1');
    if(!t) return;

    let ht = null;
    t.addEventListener('touchstart', function(){
      ht = setTimeout(function(){
        ht = null;
        if(typeof haptic === 'function') haptic('medium');
        if(typeof showAdminPanels === 'function') showAdminPanels(null, true);
      }, 700);
    }, { passive: true });
    t.addEventListener('touchend', function(){ if(ht) clearTimeout(ht); }, { passive: true });
    t.addEventListener('touchmove', function(){ if(ht) clearTimeout(ht); }, { passive: true });
  }, 900);
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof myId !== 'function' || !IS_ADMIN) return;

    const hh = document.querySelector('.topbar h1') || document.querySelector('h1');
    if(!hh || hh.querySelector('.pro-switch')) return;

    const txt = hh.innerHTML;
    hh.innerHTML = '';
    const b = document.createElement('button');
    b.className = 'pro-switch';
    b.innerHTML = '<span>' + txt + '</span><span class="cv">&#9660;</span>';
    hh.appendChild(b);

    b.addEventListener('click', function(){
      if(typeof haptic === 'function') haptic('light');
      if(typeof showAdminPanels === 'function') showAdminPanels(null, true);
    });
  }, 1000);
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof loadAdminState === 'function') loadAdminState();
  }, 500);
});
</script>
</body>
</html>
