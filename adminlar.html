<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jamoa</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
#root{padding:0 16px 100px;}
.ad-row{
  display:flex;align-items:center;gap:13px;padding:15px;
  border-radius:16px;background:#121212;border:1px solid var(--line);
  margin-bottom:11px;
}
.ad-av{width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.ad-i{flex:1;min-width:0;}
.ad-i b{display:block;font-size:14.5px;font-weight:700;}
.ad-i span{font-size:12px;color:var(--muted);}
.ad-x{
  width:34px;height:34px;border-radius:10px;border:none;flex-shrink:0;
  background:rgba(237,73,86,.14);color:#ED4956;font-size:17px;cursor:pointer;
}
.ad-tag{
  display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;
  border-radius:5px;margin-left:6px;
  background:rgba(255,215,0,.16);color:#FFD700;
}
.fab{
  position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:20px;z-index:100;
  width:56px;height:56px;border-radius:50%;border:none;background:#0095F6;
  color:#fff;font-size:26px;cursor:pointer;box-shadow:0 6px 20px rgba(0,149,246,.45);
}
.hint{margin:0 16px 16px;padding:14px;border-radius:14px;
  background:rgba(0,149,246,.08);border:1px solid rgba(0,149,246,.25);
  font-size:12.5px;color:#5AC8FA;line-height:1.55;}
.bk{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;padding:12px 20px;}
</style>
</head>
<body>

<header class="topbar" style="display:flex;align-items:center;gap:12px;">
  <h1 style="flex:1;">👨‍💼 Jamoa</h1>
  <button id="ax" style="width:36px;height:36px;border-radius:50%;border:none;
    background:rgba(255,255,255,.7);color:#0d1626;font-size:20px;cursor:pointer;">&times;</button>
</header>

<button class="bk" id="bk">← Boshqaruv markazi</button>

<div class="hint">
  ℹ️ Administrator qo'shish uchun foydalanuvchi avval botga <b>/start</b> bosgan bo'lishi kerak.
  Username yoki ID orqali qo'shasiz.
</div>

<div id="root"><div class="load">Yuklanmoqda...</div></div>
<button class="fab" id="fab">+</button>

<script src="i18n.js?v=1786724767"></script>
<script src="core.js?v=1786724767"></script>
<script>
let AD = [];

function boot(){
  const q = '/api/adminlar?init_data=' + encodeURIComponent(initData()) +
    ((typeof APP_TOKEN !== 'undefined' && APP_TOKEN) ? '&token=' + encodeURIComponent(APP_TOKEN) : '');

  api(q).then(function(d){
    if(!d.ok){
      el('root').innerHTML = '<div class="empty"><div class="ic">&#128274;</div>' +
        '<p>Kirish cheklangan</p><span>Faqat bosh administrator uchun</span></div>';
      el('fab').style.display = 'none';
      return;
    }
    AD = d.admins || [];
    draw();
  }).catch(function(){ el('root').innerHTML = '<div class="load">Xato yuz berdi</div>'; });
}

function draw(){
  let html = '<div class="ad-row">' +
    '<img class="ad-av" src="https://api.dicebear.com/7.x/initials/svg?seed=Bahromjon">' +
    '<div class="ad-i"><b>Siz<span class="ad-tag">BOSH ADMIN</span></b>' +
    '<span>Barcha huquqlar</span></div></div>';

  if(!AD.length){
    html += '<div class="empty" style="padding:40px 16px;">' +
      '<div class="ic">&#128101;</div><p>Boshqa admin yoq</p>' +
      '<span>Pastdagi + bilan qoshing</span></div>';
  } else {
    html += AD.map(function(a){
      const nm = a.name || ('ID ' + a.tg_id);
      return '<div class="ad-row" data-id="' + a.tg_id + '">' +
        '<img class="ad-av" src="https://api.dicebear.com/7.x/initials/svg?seed=' +
          encodeURIComponent(nm) + '">' +
        '<div class="ad-i"><b>' + esc(nm) + '</b>' +
        '<span>' + (a.username ? '@' + esc(a.username) : ('ID ' + a.tg_id)) + '</span></div>' +
        '<button class="ad-x">&times;</button></div>';
    }).join('');
  }

  el('root').innerHTML = html;

  document.querySelectorAll('.ad-x').forEach(function(b){
    b.addEventListener('click', function(){
      const id = b.closest('.ad-row').dataset.id;
      if(!confirm('Administrator huquqini bekor qilasizmi?')) return;
      apiPost('/api/admin-amal2', { action: 'delete', tg_id: parseInt(id) })
        .then(function(d){ if(d.ok){ toast('Bekor qilindi'); boot(); } });
    });
  });
}

function newAdmin(){
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" id="naS" style="max-height:88vh;overflow-y:auto;">' +
    '<div class="sheet-bar"></div>' +
    '<div class="sheet-title">Administrator tanlang</div>' +
    '<div class="search-bar" style="padding:0 16px 12px;">' +
      '<input class="inp" id="naQ" placeholder="Ism yoki username boyicha qidiring">' +
    '</div>' +
    '<div id="naList"><div class="load">Yuklanmoqda...</div></div></div>';

  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
  bg.querySelector('#naS').addEventListener('click', function(e){ e.stopPropagation(); });

  const q = '/api/admin-users?init_data=' + encodeURIComponent(initData()) +
    ((typeof APP_TOKEN !== 'undefined' && APP_TOKEN) ? '&token=' + encodeURIComponent(APP_TOKEN) : '');

  let USERS = [];

  api(q).then(function(d){
    if(!d.ok){
      bg.querySelector('#naList').innerHTML =
        '<div class="empty" style="padding:40px 16px;"><span>Royxat olinmadi</span></div>';
      return;
    }
    USERS = (d.users || []).filter(function(u){
      if(String(u.tg_id) === '7894423610') return false;
      return !AD.some(function(a){ return String(a.tg_id) === String(u.tg_id); });
    });
    render('');
  }).catch(function(){
    bg.querySelector('#naList').innerHTML =
      '<div class="load">Xato yuz berdi</div>';
  });

  function render(f){
    f = (f || '').toLowerCase();
    const box = bg.querySelector('#naList');
    if(!box) return;

    const list = USERS.filter(function(u){
      if(!f) return true;
      return (u.name || '').toLowerCase().indexOf(f) !== -1 ||
             (u.username || '').toLowerCase().indexOf(f) !== -1 ||
             (u.instagram || '').toLowerCase().indexOf(f) !== -1 ||
             String(u.tg_id).indexOf(f) !== -1;
    }).slice(0, 60);

    if(!list.length){
      box.innerHTML = '<div class="empty" style="padding:40px 16px;"><span>Topilmadi</span></div>';
      return;
    }

    box.innerHTML = list.map(function(u){
      const nm = u.name || u.instagram || ('ID ' + u.tg_id);
      const role = u.role === 'makler' ? 'Sotuvchi' : (u.role === 'xaridor' ? 'Xaridor' : '');
      return '<div class="ad-row" data-tg="' + u.tg_id + '" data-n="' + esc(nm) + '"' +
        ' style="cursor:pointer;margin:0 16px 9px;">' +
        '<img class="ad-av" src="https://api.dicebear.com/7.x/initials/svg?seed=' +
          encodeURIComponent(nm) + '">' +
        '<div class="ad-i"><b>' + esc(nm) + '</b>' +
        '<span>' + (u.username ? '@' + esc(u.username) + ' · ' : '') + role + '</span></div>' +
        '<span style="color:#0095F6;font-size:20px;">+</span></div>';
    }).join('') + '<div style="height:20px;"></div>';

    box.querySelectorAll('.ad-row[data-tg]').forEach(function(r){
      r.addEventListener('click', function(){
        const tg = r.dataset.tg;
        const nm = r.dataset.n;
        if(!confirm(nm + ' ni administrator qilasizmi?')) return;

        r.style.opacity = '.5';
        apiPost('/api/admin-amal2', { action: 'add', target: tg }).then(function(d){
          if(d.ok){
            haptic('medium');
            toast('Qoshildi: ' + (d.name || nm));
            bg.remove();
            boot();
          } else {
            toast(d.error || 'Xato');
            r.style.opacity = '1';
          }
        }).catch(function(){
          toast('Server xatosi');
          r.style.opacity = '1';
        });
      });
    });
  }

  const qi = bg.querySelector('#naQ');
  if(qi) qi.addEventListener('input', function(e){ render(e.target.value); });
}

document.addEventListener('DOMContentLoaded', function(){
  el('fab').addEventListener('click', newAdmin);
  el('bk').addEventListener('click', function(){ location.href = 'zaxira.html'; });
  el('ax').addEventListener('click', function(){
    let last = null;
    try { last = localStorage.getItem('ni_admin_panel'); } catch(e){}
    location.href = (last && last !== 'zaxira.html') ? last : 'sotuvchi.html';
  });
  setTimeout(function(){
    if(typeof checkSession === 'function') checkSession(function(){ boot(); });
    else boot();
  }, 400);
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof loadAdminState === 'function') loadAdminState();
  }, 500);
});
</script>
</body>
</html>
