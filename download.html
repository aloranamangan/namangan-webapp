<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UYgram — Ilovani yuklab olish</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Manrope',sans-serif;
    background:linear-gradient(180deg,#0B1F3A 0%,#142B52 100%);
    color:#F7F5F0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .card{max-width:420px;width:100%;text-align:center;}
  .logo{
    width:110px;height:110px;border-radius:24px;margin:0 auto 20px;
    border:2px solid #D4AF37;overflow:hidden;
  }
  .logo img{width:100%;height:100%;object-fit:cover;}
  h1{font-family:'Marcellus',serif;font-weight:400;font-size:26px;margin-bottom:8px;}
  h1 span{color:#F0C868;}
  p{color:#93A0BD;font-size:14px;margin-bottom:28px;}
  .btn{
    display:block;width:100%;padding:16px;border-radius:14px;
    background:linear-gradient(135deg,#F0C868,#D4AF37);
    color:#0B1F3A;font-weight:800;font-size:16px;text-decoration:none;
    box-shadow:0 8px 24px rgba(212,175,55,0.35);
    margin-bottom:16px;
  }
  .note{
    font-size:12.5px;color:#93A0BD;line-height:1.6;
    background:rgba(255,255,255,0.04);padding:14px;border-radius:12px;
    border:1px solid rgba(212,175,55,0.2);
  }
  .note b{color:#F0C868;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="icon-512.png" alt="UYgram"></div>
    <h1>Namangan <span>Ijara</span></h1>
    <p>Ilovani telefoningizga o'rnating</p>
    <a href="namangan-ijara.apk" class="btn" download>⬇️ Ilovani yuklab olish</a>
    <div class="note">
      Yuklab bo'lgach faylni oching. Agar <b>"Noma'lum manba"</b> haqida ogohlantirish chiqsa,
      <b>"Ruxsat berish"</b> yoki <b>"O'rnatish"</b> tugmasini bosing — bu oddiy Android xavfsizlik
      so'rovi, ilova xavfsiz.
    </div>
  </div>
</body>
</html>
