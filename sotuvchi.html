<script src="splash.js"></script>
<script src="reg.js"></script>

<script src="story.js"></script>
<script src="pano.js"></script>
<script>
let ME = null;
let POSTS = [];
let picked = [];
const MAX_MEDIA = 10;

function boot(){
  if(typeof showSplash === 'function' && isApk()){
    showSplash(function(){
      requireAuth(function(){
        checkSubs(function(){ askRole(function(){ bootAuthed(); }); });
      });
    });
  } else {
    requireAuth(function(){ checkSubs(function(){ bootAuthed(); }); });
  }
}

function bootAuthed(){
  checkRestriction(function(stop){
    if(stop) return;
    bootReal();
  });
}

function bootReal(){
  let tries = 0;
  const wait = setInterval(function(){
    tries++;
    if(myId()){ clearInterval(wait); start(); return; }
    if(tries > 12){
      clearInterval(wait);
      el('root').innerHTML = '<div class="empty"><div class="ic">&#128241;</div>' +
        '<p>Telegram kerak</p><span>Ilovani qayta oching yoki Telegramni yangilang.</span></div>';
    }
  }, 400);
}

function start(){
  checkUser(function(u){
    if(needReg()){
      showReg('makler', loadProfile);
      return;
    }
    loadProfile();
  });
}

function loadProfile(){
  el('root').innerHTML = '<div class="load">Yuklanmoqda...</div>';
  api('/api/mening-profilim?tg_id=' + myId())
    .then(function(d){
      ME = d.ok ? d : null;
      return api('/api/postlar' + (ME ? '?username=' + encodeURIComponent(ME.username) : ''));
    })
    .then(function(p){
      POSTS = (p && p.ok) ? p.posts : [];
      render();
    })
    .catch(function(){ ME = null; POSTS = []; render(); });
}

function render(){
  if(!ME){ renderForm(); return; }
  if(ME.status !== 'approved'){ renderPending(); return; }
  renderCabinet();
}

function renderPending(){
  el('root').innerHTML = '<div class="empty"><div class="ic">&#9203;</div>' +
    '<p>Arizangiz korib chiqilmoqda</p>' +
    '<span>Admin tasdiqlagach kabinetingiz ochiladi.</span></div>';
}

function renderForm(){
  el('root').innerHTML =
    '<div class="wrap">' +
      '<div class="empty" style="padding:10px 0 22px;">' +
        '<div class="ic">&#127968;</div><p>Makler bolib ishlang</p>' +
        '<span>Ariza qoldiring &mdash; admin tasdiqlagach<br>elon joylay boshlaysiz.</span>' +
      '</div>' +
      '<label class="label">Ism familiya</label>' +
      '<input class="inp" id="fName" placeholder="Bahromjon Karimov">' +
      '<label class="label">Username</label>' +
      '<input class="inp" id="fUser" placeholder="bahromjon_makler">' +
      '<label class="label">Yonalishingiz</label>' +
      '<div class="checks">' +
        '<label class="check"><input type="checkbox" id="cSell"> Sotuvchi</label>' +
        '<label class="check"><input type="checkbox" id="cRent"> Ijarachi</label>' +
      '</div>' +
      '<button class="btn" id="sendBtn">Ariza yuborish</button>' +
    '</div>';

  el('sendBtn').addEventListener('click', function(){
    const name = el('fName').value.trim();
    const user = el('fUser').value.trim().replace(/^@/, '');
    const roles = [];
    if(el('cSell').checked) roles.push('sotuvchi');
    if(el('cRent').checked) roles.push('ijarachi');

    if(name.length < 3){ toast('Ismni toliq kiriting'); return; }
    if(!/^[a-zA-Z0-9_]{3,32}$/.test(user)){ toast('Username: lotin harflari, raqam, _'); return; }
    if(!roles.length){ toast('Yonalish tanlang'); return; }

    const b = el('sendBtn');
    b.disabled = true;
    b.textContent = 'Yuborilmoqda...';

    apiPost('/api/makler-ariza', {
      name: name, username: user, phone: USER.phone, roles: roles
    }).then(function(d){
      if(d.ok){
        haptic('medium');
        ME = { username: user, name: name, phone: USER.phone, roles: roles, status: 'pending', followers: 0 };
        render();
      } else {
        toast('Xato: ' + (d.error || 'server'));
        b.disabled = false;
        b.textContent = 'Ariza yuborish';
      }
    }).catch(function(){
      toast('Server bilan boglanishda xato');
      b.disabled = false;
      b.textContent = 'Ariza yuborish';
    });
  });
}

function renderCabinet(){
  const ava = ME.avatar
    ? mediaUrl(ME.avatar)
    : 'https://api.dicebear.com/7.x/initials/svg?seed=' + encodeURIComponent(ME.name);
  const roles = (ME.roles || []).map(function(r){
    return r === 'sotuvchi' ? '<span class="role s">Sotuvchi</span>'
                            : '<span class="role i">Ijarachi</span>';
  }).join('');
  const views = POSTS.reduce(function(a, p){ return a + (p.views || 0); }, 0);

  el('root').innerHTML =

    '<div class="pro-top">' +
      '<div class="pro-ava-wrap"><img class="pro-ava" src="' + ava + '">' +
      '<button class="pro-add" id="addBtn">+</button></div>' +
      '<div class="pro-stats">' +
        '<div class="pro-stat"><b>' + POSTS.length + '</b><span>elon</span></div>' +
        '<div class="pro-stat"><b>' + fmt(ME.followers) + '</b><span>obunachi</span></div>' +
        '<div class="pro-stat"><b>' + fmt(views) + '</b><span>korish</span></div>' +
      '</div></div>' +

    '<div class="pro-bio"><b>' + esc(ME.name) + '</b>' +
      '<div class="roles">' + roles + '</div>' +
      '<div class="ph">@' + esc(ME.username) + ' &middot; ' + esc(ME.phone) + '</div></div>' +

    '<div class="pro-btns">' +
      '<button id="newBtn">&#65291;&nbsp;Yangi eʼlon</button>' +
      '<button id="storyBtn">&#128248;&nbsp;Storiy</button>' +

      '<button id="shareBtn">Ulashish</button>' +
    '</div>' +


    '<div class="stat-card" id="statCard">' +
      '<div class="stat-sub">Yuklanmoqda...</div></div>' +
    '<div class="hl-row" id="hlRow"></div>' +
    '<div class="grid" id="grid"></div>' +
    '<div class="wrap"><button class="btn danger" id="delBtn">Kabinetni ochirish</button></div>';

  drawGrid();
  loadStats();
  loadNotifs();
  el('addBtn').addEventListener('click', addStory);
  el('newBtn').addEventListener('click', openUpload);
  el('shareBtn').addEventListener('click', shareMe);
  el('storyBtn').addEventListener('click', addStory);


  const av = document.querySelector('.pro-ava');
  if(av){
    av.style.cursor = 'pointer';
    av.addEventListener('click', avatarMenu);
  }
  markAvatarStory();
  drawHighlights();
  el('delBtn').addEventListener('click', deleteMe);
}

function drawGrid(){
  const g = el('grid');
  if(!POSTS.length){
    g.innerHTML = '<div class="empty" style="grid-column:1/-1;">' +
      '<div class="ic">&#128247;</div><p>Hali elon yoq</p>' +
      '<span>&#65291; tugmasi bilan birinchi eloningizni joylang</span></div>';
    return;
  }
  g.innerHTML = POSTS.map(function(p, i){
    const m = (p.media && p.media.length) ? p.media : [{ file_id: p.file_id, is_video: p.is_video }];
    const f = m[0] || {};
    const url = f.file_id ? mediaUrl(f.file_id) : '';
    const inner = f.is_video
      ? '<video src="' + url + '" muted preload="metadata"></video>'
      : '<img src="' + url + '" loading="lazy">';
    const multi = m.length > 1
      ? '<svg class="multi" viewBox="0 0 24 24" fill="#fff"><rect x="7" y="3" width="14" height="14" rx="2"/><rect x="3" y="7" width="14" height="14" rx="2" opacity=".85"/></svg>'
      : '';
    return '<div class="cell" data-full="' + url + '" data-v="' + (f.is_video ? '1' : '0') + '">' +
      inner + multi +
      (p.pinned ? '<span class="cell-pin">&#128204;</span>' : '') +
      '<button class="cell-menu" data-mi="' + i + '">&#8942;</button></div>';
  }).join('');

  const gal = POSTS.map(function(p){
    const mm = (p.media && p.media.length) ? p.media : [{ file_id: p.file_id, is_video: p.is_video }];
    return { media: mm.filter(function(x){ return x.file_id; }).map(function(x){
      return { url: mediaUrl(x.file_id), video: !!x.is_video };
    }) };
  });

  g.querySelectorAll('.cell').forEach(function(c, i){
    let lt = null;

    c.addEventListener('click', function(){
      openGallery(gal[i].media, 0, true, gal, i);
    });

    const mb = c.querySelector('.cell-menu');
    if(mb) mb.addEventListener('click', function(e){
      e.stopPropagation();
      postMenu(POSTS[i]);
    });

    c.addEventListener('touchstart', function(){
      lt = setTimeout(function(){
        lt = null;
        postMenu(POSTS[i]);
      }, 600);
    }, { passive: true });

    c.addEventListener('touchend', function(){ if(lt) clearTimeout(lt); }, { passive: true });
    c.addEventListener('touchmove', function(){ if(lt) clearTimeout(lt); }, { passive: true });
  });
}

function shareMe(){
  const txt = ME.name + ' - Namangan Ijara\n@' + ME.username;
  const url = 'https://t.me/share/url?url=' + encodeURIComponent('https://t.me/Ijaraga_uybot') +
              '&text=' + encodeURIComponent(txt);
  if(TG && TG.openTelegramLink) TG.openTelegramLink(url);
  else window.open(url, '_blank');
}

function deleteMe(){
  if(!confirm('Kabinetingizni butunlay ochirasizmi?')) return;
  apiPost('/api/makler-ochirish', { username: ME.username })
    .then(function(d){
      if(d.ok){ toast('Ochirildi'); ME = null; POSTS = []; render(); }
      else toast('Xato yuz berdi');
    })
    .catch(function(){ toast('Server xatosi'); });
}

function openUpload(){
  pickFiles(true, function(items){
    if(!items.length){ toast('Fayl tanlanmadi'); return; }
    picked = items.slice(0, MAX_MEDIA);
    showSheet();
  });
}

function showSheet(){
  let type = 'sotuv';
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" id="uSheet"><div class="sheet-bar"></div>' +
    '<div class="wrap" style="padding-top:4px;">' +
      '<div class="count" id="cnt"></div>' +
      '<div class="strip" id="strip"></div>' +
      '<div class="seg" style="margin-top:16px;">' +
        '<button class="on" data-t="sotuv">Sotiladi</button>' +
        '<button data-t="ijara">Ijaraga beriladi</button>' +
      '</div>' +
      '<label class="label">Sarlavha</label>' +
      '<input class="inp" id="uTitle" placeholder="Kvartira, Pahlavon mahallasi">' +
      '<label class="label">Narx</label>' +
      '<input class="inp" id="uPrice" placeholder="85 000 000 som">' +
      '<label class="label">Malumot</label>' +
      '<textarea class="txt" id="uDesc" placeholder="Manzil, xonalar soni, qavat..."></textarea>' +
      '<div class="geo-pick" id="geoPick"><span class="ic">&#128205;</span>' +
      '<span class="tx"><b>Xaritada belgilash</b>' +
      '<span id="geoName">Ixtiyoriy — xaritadan tanlang</span></span></div>' +
      (myId() === 7894423610
        ? '<div class="pano-pick" id="panoPick"><span class="ic">&#127760;</span>' +
          '<span class="tx"><b>360&deg; panorama</b>' +
          '<span id="panoName">Ixtiyoriy — panorama rasm</span></span></div>'
        : '') +
      '<button class="btn" id="uSend">Joylash</button>' +
      '<button class="btn ghost" id="uCancel" style="margin-top:9px;">Bekor qilish</button>' +
    '</div></div>';

  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) close(); });
  el('uSheet').addEventListener('click', function(e){ e.stopPropagation(); });

  drawStrip();

  bg.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      bg.querySelectorAll('.seg button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      type = b.dataset.t;
    });
  });

  let geoLat = null, geoLng = null;
  const gp = el('geoPick');
  if(gp) gp.addEventListener('click', function(){
    openGeoPicker(function(la, ln){
      geoLat = la; geoLng = ln;
      gp.classList.add('on');
      el('geoName').textContent = la.toFixed(5) + ', ' + ln.toFixed(5);
    });
  });

  let panoData = null;
  const pp = el('panoPick');
  if(pp) pp.addEventListener('click', function(){
    pickFiles(false, function(items){
      if(!items.length || items[0].is_video){ toast('Faqat rasm'); return; }
      panoData = items[0].media;
      pp.classList.add('on');
      el('panoName').textContent = 'Tanlandi';
    });
  });

  el('uCancel').addEventListener('click', close);

  el('uSend').addEventListener('click', function(){
    const title = el('uTitle').value.trim();
    const price = el('uPrice').value.trim();
    const desc = el('uDesc').value.trim();

    if(!picked.length){ toast('Rasm tanlang'); return; }
    if(!title){ toast('Sarlavhani kiriting'); return; }
    if(!price){ toast('Narxni kiriting'); return; }

    const b = el('uSend');
    b.disabled = true;
    b.textContent = 'Yuklanmoqda...';

    const head = type === 'sotuv' ? 'Sotiladi' : 'Ijaraga beriladi';
    const full = head + '\n' + title + (desc ? '\n' + desc : '');

    apiPost('/api/post-qoshish', {
      items: picked, price: price, description: full,
      lat: geoLat, lng: geoLng
    })
      .then(function(d){
        if(d.ok && panoData){
          apiPost('/api/pano-qoshish', {
            media: panoData, price: price, description: '360 panorama\n' + title
          }).catch(function(){});
        }
        if(d.ok){
          haptic('medium');
          toast('Elon joylandi');
          picked = [];
          close();
          setTimeout(loadProfile, 1500);
        } else {
          toast('Xato: ' + (d.error || 'server'));
          b.disabled = false;
          b.textContent = 'Joylash';
        }
      })
      .catch(function(){
        toast('Server bilan boglanishda xato');
        b.disabled = false;
        b.textContent = 'Joylash';
      });
  });

  function close(){ picked = []; bg.remove(); }

  function drawStrip(){
    const s = el('strip');
    if(!s) return;
    s.innerHTML = picked.map(function(it, i){
      const inner = it.is_video
        ? '<video src="' + it.media + '" muted></video>'
        : '<img src="' + it.media + '">';
      return '<div class="thumb">' + inner + '<button data-i="' + i + '">&times;</button></div>';
    }).join('') + (picked.length < MAX_MEDIA ? '<button class="add-more" id="addMore">&#65291;</button>' : '');

    el('cnt').textContent = picked.length + ' / ' + MAX_MEDIA;

    s.querySelectorAll('.thumb button').forEach(function(b){
      b.addEventListener('click', function(){
        picked.splice(parseInt(b.dataset.i), 1);
        drawStrip();
      });
    });

    const am = el('addMore');
    if(am) am.addEventListener('click', function(){
      pickFiles(true, function(items){
        picked = picked.concat(items).slice(0, MAX_MEDIA);
        drawStrip();
      });
    });
  }
}


function loadStats(){
  api('/api/statistika?username=' + encodeURIComponent(ME.username))
    .then(function(d){ drawStats(d.ok ? d : { days: [], total: 0 }); })
    .catch(function(){ drawStats({ days: [], total: 0 }); });
}

function drawStats(d){
  const box = el('statCard');
  if(!box) return;

  const map = {};
  (d.days || []).forEach(function(r){ map[r.date] = r.count; });

  const days = [];
  const now = new Date();
  for(let i = 29; i >= 0; i--){
    const dt = new Date(now.getTime() - i * 86400000);
    const key = dt.toISOString().slice(0, 10);
    days.push({ key: key, n: map[key] || 0 });
  }

  const max = Math.max(1, Math.max.apply(null, days.map(function(x){ return x.n; })));
  const bars = days.map(function(x){
    const hp = Math.round(x.n / max * 100);
    return '<div class="bar" style="height:' + Math.max(3, hp) + '%"></div>';
  }).join('');

  const first = days[0].key.slice(5).replace('-', '.');
  const last = days[29].key.slice(5).replace('-', '.');

  box.className = 'stat-mini';
  box.innerHTML = '<b>Professional panel</b>' +
    '<span>' + fmt(d.total || 0) + ' korish oxirgi 30 kunda</span>';

  box.onclick = function(){ showFullStats(d, bars, first, last); };
}

function showFullStats(d, bars, first, last){
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" id="stSheet"><div class="sheet-bar"></div>' +
    '<div class="sheet-title">Statistika</div>' +
    '<div class="wrap">' +
      '<div class="stat-card" style="margin:0 0 14px;">' +
        '<div class="stat-head"><b>' + fmt(d.total || 0) + '</b><span>oxirgi 30 kun</span></div>' +
        '<div class="stat-sub">Korishlar</div>' +
        '<div class="chart">' + bars + '</div>' +
        '<div class="chart-x"><span>' + first + '</span><span>' + last + '</span></div>' +
      '</div>' +
      '<div class="stat-card" style="margin:0;">' +
        '<div class="stat-head"><b>' + POSTS.length + '</b><span>jami</span></div>' +
        '<div class="stat-sub">Elonlar</div>' +
      '</div>' +
    '</div></div>';

  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
  el('stSheet').addEventListener('click', function(e){ e.stopPropagation(); });
}


// ---------- Bildirishnomalar ----------
function loadNotifs(){
  if(!ME || !ME.username) return;
  const b = el('bellBtn');
  if(b) b.style.display = 'flex';

  api('/api/bildirishnomalar?username=' + encodeURIComponent(ME.username))
    .then(function(d){
      const n = d.unseen || 0;
      const dot = el('bellN');
      if(dot){
        dot.style.display = n > 0 ? 'flex' : 'none';
        dot.textContent = n > 99 ? '99+' : n;
      }
      window.__notifs = d.items || [];
    })
    .catch(function(){});
}

function openNotifs(){
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" id="nfSheet" style="max-height:88vh;">' +
    '<div class="sheet-bar"></div><div class="sheet-title">Bildirishnomalar</div>' +
    '<div id="nfBody"><div class="load">Yuklanmoqda...</div></div></div>';

  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
  el('nfSheet').addEventListener('click', function(e){ e.stopPropagation(); });

  api('/api/bildirishnomalar?username=' + encodeURIComponent(ME.username))
    .then(function(d){
      const box = el('nfBody');
      if(!box) return;
      const list = d.items || [];
      if(!list.length){
        box.innerHTML = '<div class="empty" style="padding:50px 16px;">' +
          '<div class="ic">&#128276;</div><p>Hali bildirishnoma yoq</p>' +
          '<span>Kim layk bossa, obuna bolsa yoki koment yozsa shu yerda chiqadi</span></div>';
        return;
      }
      box.innerHTML = list.map(function(x){
        let ic = '&#10084;&#65039;', txt = 'eloningizga layk bosdi';
        if(x.kind === 'follow'){ ic = '&#128100;'; txt = 'sizga obuna boldi'; }
        else if(x.kind === 'comment'){ ic = '&#128172;'; txt = 'koment yozdi: ' + esc(x.text); }
        return '<div class="nf' + (x.seen ? '' : ' new') + '">' +
          '<img src="https://api.dicebear.com/7.x/initials/svg?seed=' + encodeURIComponent(x.name) + '">' +
          '<div class="nf-txt"><b>' + esc(x.name) + '</b> <span>' + txt + '</span></div>' +
          '<span class="nf-ic">' + ic + '</span></div>';
      }).join('');

      apiPost('/api/korildi', { username: ME.username }).catch(function(){});
      const dot = el('bellN');
      if(dot) dot.style.display = 'none';
    })
    .catch(function(){
      const box = el('nfBody');
      if(box) box.innerHTML = '<div class="empty" style="padding:44px 10px;"><span>Xato yuz berdi</span></div>';
    });
}

function addStory(){
  pickFiles(false, function(items){
    if(!items.length) return;
    const it = items[0];
    toast('Yuklanmoqda...');
    apiPost('/api/post-qoshish', { items: [it], price: '', description: 'STORY' })
      .then(function(){
        setTimeout(function(){
          api('/api/postlar?username=' + encodeURIComponent(ME.username)).then(function(p){
            const list = (p.posts || []).filter(function(x){ return x.description === 'STORY'; });
            if(!list.length){ toast('Xato'); return; }
            const last = list[0];
            const m = (last.media && last.media[0]) ? last.media[0] : { file_id: last.file_id, is_video: last.is_video };
            apiPost('/api/story-qoshish', { file_id: m.file_id, is_video: m.is_video })
              .then(function(d){
                if(d.ok){ haptic('medium'); toast('Storiyga qoshildi'); drawMyStories(); }
                else toast('Xato');
              });
          });
        }, 2500);
      })
      .catch(function(){ toast('Server xatosi'); });
  });
}

function drawMyStories(){
  const box = el('myStories');
  if(!box || !ME) return;

  loadStories(function(){
    const groups = groupStories();
    if(!groups.length){ box.style.display = 'none'; return; }
    box.style.display = 'flex';
    box.innerHTML = groups.map(function(g, i){
      const seenAll = g.items.every(function(s){ return isStorySeen(s.id); });
      return '<button class="story" data-i="' + i + '">' +
        '<div class="story-ring ' + (seenAll ? 'seen' : 'fresh') + '"><img src="https://api.dicebear.com/7.x/initials/svg?seed=' +
        encodeURIComponent(g.name) + '"></div>' +
        '<span>' + esc(g.name) + '</span></button>';
    }).join('');
    box.querySelectorAll('.story').forEach(function(b){
      b.addEventListener('click', function(){
        openStory(groups[parseInt(b.dataset.i)], 0);
      });
    });
  });
}


function drawHighlights(){
  const box = el('hlRow');
  if(!box || !myId()) return;

  api('/api/aktuallar?tg_id=' + myId()).then(function(d){
    const list = d.items || [];
    box.innerHTML =
      '<button class="hl" id="hlAdd"><div class="hl-c add">&#65291;</div><span>Yangi</span></button>' +
      list.map(function(x){
        const u = mediaUrl(x.file_id);
        const inner = x.is_video
          ? '<video src="' + u + '" muted></video>'
          : '<img src="' + u + '">';
        return '<button class="hl" data-id="' + x.id + '" data-u="' + u + '" data-v="' +
          (x.is_video ? '1' : '0') + '"><div class="hl-c">' + inner + '</div>' +
          '<span>' + esc(x.title) + '</span></button>';
      }).join('');

    el('hlAdd').addEventListener('click', addHighlight);

    box.querySelectorAll('.hl[data-id]').forEach(function(b){
      b.addEventListener('click', function(){
        openGallery([{ url: b.dataset.u, video: b.dataset.v === '1' }], 0, false, null);
      });
      let t = null;
      b.addEventListener('touchstart', function(){
        t = setTimeout(function(){
          if(confirm('Aktualni ochirasizmi?')){
            apiPost('/api/aktual-ochirish', { id: b.dataset.id })
              .then(function(){ drawHighlights(); });
          }
        }, 700);
      }, { passive: true });
      b.addEventListener('touchend', function(){ clearTimeout(t); }, { passive: true });
    });
  }).catch(function(){});
}

function addHighlight(){

    if(!list.length){ toast('Avval storiy joylang'); return; }

    }).join('');

    el('hlPick').querySelectorAll('.cell').forEach(function(c){
      c.addEventListener('click', function(){
        const title = el('hlTitle').value.trim() || 'Aktual';

        }).catch(function(){ toast('Server xatosi'); });

  }).catch(function(){ toast('Xato'); });

function openGeoPicker(cb){
  const d = document.createElement('div');
  d.id = 'geoMap';
  d.innerHTML = '<div id="geoMapBox"></div>' +
    '<div class="geo-center">&#128205;</div>' +
    '<button class="geo-x" id="geoX">&times;</button>' +
    '<button class="geo-ok" id="geoOk">Shu joyni tasdiqlash</button>';
  document.body.appendChild(d);

  const m = L.map('geoMapBox', { zoomControl: false, attributionControl: false })
    .setView([40.9983, 71.6726], 14);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { maxZoom: 19 }).addTo(m);
  L.control.zoom({ position: 'bottomright' }).addTo(m);

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(p){
      m.setView([p.coords.latitude, p.coords.longitude], 16);
    }, function(){}, { timeout: 4000 });
  }

  el('geoX').addEventListener('click', function(){ d.remove(); });
  el('geoOk').addEventListener('click', function(){
    const c = m.getCenter();
    d.remove();
    cb(c.lat, c.lng);
    haptic('medium');
  });

  setTimeout(function(){ m.invalidateSize(); }, 200);
}


function postMenu(p){
  if(!p) return;
  haptic('medium');

  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" id="pmS"><div class="sheet-bar"></div>' +
    '<div class="sheet-title">Eʼlon boshqaruvi</div>' +
    '<button class="sheet-item" data-a="edit">&#9999;&#65039;&nbsp;&nbsp;Tahrirlash</button>' +
    '<button class="sheet-item" data-a="pin">&#128204; ' +
      (p.pinned ? 'Qadashni bekor qilish' : 'Tepaga qadash') + '</button>' +
    '<button class="sheet-item" data-a="geo">&#128205;&nbsp;&nbsp;Joylashuvni belgilash</button>' +
    '<button class="sheet-item danger" data-a="del">&#128465;&#65039;&nbsp;&nbsp;Eʼlonni oʻchirish</button>' +
    '</div>';

  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
  el('pmS').addEventListener('click', function(e){ e.stopPropagation(); });

  bg.querySelectorAll('.sheet-item').forEach(function(b){
    b.addEventListener('click', function(){
      const a = b.dataset.a;
      bg.remove();

      if(a === 'del'){
        if(!confirm('Elonni ochirasizmi?\n\nLayk, komentariya, korishlar ham ochadi.')) return;
        apiPost('/api/post-ochirish', { post_id: p.id }).then(function(d){
          if(d.ok){ haptic('medium'); toast('Ochirildi'); loadProfile(); }
          else toast(d.error || 'Xato');
        }).catch(function(){ toast('Server xatosi'); });
      }

      if(a === 'edit') editPost(p);

      if(a === 'pin'){
        apiPost('/api/post-pin', { post_id: p.id, on: !p.pinned }).then(function(d){
          if(d.ok){
            haptic('medium');
            toast(p.pinned ? 'Qadash bekor qilindi' : 'Tepaga qadaldi');
            loadProfile();
          } else toast('Xato');
        }).catch(function(){ toast('Server xatosi'); });
      }

      if(a === 'geo'){
        openGeoPicker(function(la, ln){
          apiPost('/api/post-tahrirlash', {
            post_id: p.id, price: p.price || '',
            description: p.description || '', lat: la, lng: ln
          }).then(function(d){
            if(d.ok){ haptic('medium'); toast('Joylashuv saqlandi'); }
            else toast('Xato');
          });
        });
      }
    });
  });
}

function editPost(p){
  const lines = String(p.description || '').split('\n');
  const head = lines[0] || '';
  const title = lines[1] || '';
  const body = lines.slice(2).join('\n');

  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" id="epS" style="max-height:88vh;">' +
    '<div class="sheet-bar"></div><div class="sheet-title">Eʼlonni tahrirlash</div>' +
    '<div class="wrap">' +
    '<label class="label">Sarlavha</label>' +
    '<input class="inp" id="eT" value="' + esc(title) + '">' +
    '<label class="label">Narx</label>' +
    '<input class="inp" id="eP" value="' + esc(p.price || '') + '">' +
    '<label class="label">Malumot</label>' +
    '<textarea class="txt" id="eD">' + esc(body) + '</textarea>' +
    '<button class="btn" id="eGo">Saqlash</button></div></div>';

  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
  el('epS').addEventListener('click', function(e){ e.stopPropagation(); });

  el('eGo').addEventListener('click', function(){
    const t = el('eT').value.trim();
    if(!t){ toast('Sarlavhani kiriting'); return; }

    const full = head + '\n' + t + (el('eD').value.trim() ? '\n' + el('eD').value.trim() : '');
    const b = el('eGo');
    b.disabled = true;
    b.textContent = 'Saqlanmoqda...';

    apiPost('/api/post-tahrirlash', {
      post_id: p.id, price: el('eP').value.trim(), description: full
    }).then(function(d){
      if(d.ok){ haptic('medium'); toast('Saqlandi'); bg.remove(); loadProfile(); }
      else { toast('Xato'); b.disabled = false; b.textContent = 'Saqlash'; }
    }).catch(function(){
      toast('Server xatosi'); b.disabled = false; b.textContent = 'Saqlash';
    });
  });
}


function markAvatarStory(){
  if(!ME) return;
  loadStories(function(){
    const mine = STORIES.filter(function(s){ return s.owner_id === myId(); });
    const w = document.querySelector('.pro-ava-wrap');
    if(!w) return;

    if(!mine.length){ w.classList.remove('has-story', 'seen'); return; }

    w.classList.add('has-story');
    const allSeen = mine.every(function(s){ return isStorySeen(s.id); });
    w.classList.toggle('seen', allSeen);


  });
}


function avatarMenu(){
  haptic('light');

  loadStories(function(){
    const mine = STORIES.filter(function(s){ return s.owner_id === myId(); });

    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = '<div class="sheet" id="avS"><div class="sheet-bar"></div>' +
      '<div class="sheet-title">Profil</div>' +
      (mine.length
        ? '<button class="sheet-item" data-a="view">&#128065;&#65039;&nbsp;&nbsp;Storiyni koʻrish</button>'
        : '') +
      '<button class="sheet-item" data-a="story">&#128248;&nbsp;&nbsp;Yangi storiy qoʻshish</button>' +
      '<button class="sheet-item" data-a="ava">&#128100;&nbsp;&nbsp;Rasmni almashtirish</button>' +
      '</div>';

    document.body.appendChild(bg);
    bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
    el('avS').addEventListener('click', function(e){ e.stopPropagation(); });

    bg.querySelectorAll('.sheet-item').forEach(function(b){
