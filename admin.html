<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Admin panel</title>
<link rel="stylesheet" href="style.css?v=1788366130">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{background:#0a0a0a;}
.topbar{background:linear-gradient(180deg,#111 0%,#0a0a0a 100%);border-bottom:1px solid #1f1f1f;}
.hdr{padding:16px 14px 10px;}
.hdr .box{
  background:linear-gradient(145deg,#161616,#111);
  border:1px solid #232323;border-radius:16px;padding:15px 10px;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.hdr .box b{font-size:24px;background:linear-gradient(135deg,#fff,#999);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hdr .box span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;}
.search-bar input{background:#141414;border:1px solid #232323;border-radius:14px;}
.au{
  margin:0 14px 10px;padding:14px;border:1px solid #1f1f1f;
  border-radius:16px;background:linear-gradient(145deg,#131313,#0f0f0f);
}
.au img{border:1.5px solid #262626;}
.rb{letter-spacing:.04em;}
.menu-btn{opacity:.6;}
.menu-btn:active{opacity:1;}

.au{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #1a1a1a;}
.au img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.au .ai{flex:1;min-width:0;}
.au .ai b{display:block;font-size:14px;font-weight:700;}
.au .ai .ln{font-size:12px;color:var(--muted);margin-top:2px;}
.au .ai .ln a{color:var(--blue);text-decoration:none;}
.rb{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:4px;}
.rb.m{background:rgba(46,204,113,.16);color:#2ECC71;}
.rb.x{background:rgba(0,149,246,.16);color:#0095F6;}
.rb.ok{background:rgba(46,204,113,.16);color:#2ECC71;}
.rb.pd{background:rgba(255,193,7,.16);color:#FFC107;}
.hdr{display:flex;gap:10px;padding:12px 16px;}
.hdr .box{flex:1;background:#121212;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
.hdr .box b{display:block;font-size:20px;font-weight:800;}
.hdr .box span{font-size:11px;color:var(--muted);}
</style>
</head>
<body>

<header class="topbar"><h1>Nazorat <span class="gold">markazi</span></h1></header>
<div class="hdr" id="stats"></div>
<div class="search-bar"><input id="q" placeholder="Ism, telefon yoki username boyicha qidiring"></div>
<div id="list"><div class="load">Yuklanmoqda...</div></div>

<script src="i18n.js?v=1786724767"></script>
<script src="core.js?v=1788265829"></script>
<script>
let USERS = [];

function boot(){
  const q = '/api/admin-users?init_data=' + encodeURIComponent(initData()) +
    (APP_TOKEN ? '&token=' + encodeURIComponent(APP_TOKEN) : '');
  api(q)
    .then(function(d){
      if(!d.ok){
        el('list').innerHTML = '<div class="empty"><div class="ic">&#128274;</div>' +
          '<p>Kirish cheklangan</p><span>Bu bolim faqat administratorlar uchun</span></div>';
        return;
      }
      USERS = d.users || [];
      drawStats();
      draw(USERS);
    })
    .catch(function(){
      el('list').innerHTML = '<div class="empty"><span>Xato yuz berdi</span></div>';
    });
}

function drawStats(){
  const m = USERS.filter(function(u){ return u.role === 'makler'; }).length;
  const x = USERS.filter(function(u){ return u.role === 'xaridor'; }).length;
  el('stats').innerHTML =
    '<div class="box"><b>' + USERS.length + '</b><span>jami aʼzo</span></div>' +
    '<div class="box"><b>' + m + '</b><span>sotuvchi</span></div>' +
    '<div class="box"><b>' + x + '</b><span>xaridor</span></div>';
}

function draw(list){
  const box = el('list');
  if(!list.length){
    box.innerHTML = '<div class="empty"><span>Topilmadi</span></div>';
    return;
  }
  box.innerHTML = list.map(function(u){
    const nm = u.name || u.instagram || ('ID ' + u.tg_id);
    const role = u.role === 'makler'
      ? '<span class="rb m">Sotuvchi</span>'
      : (u.role === 'xaridor' ? '<span class="rb x">Xaridor</span>' : '');
    const st = u.status === 'approved'
      ? '<span class="rb ok">Tasdiqlangan</span>'
      : (u.status === 'pending' ? '<span class="rb pd">Kutilmoqda</span>' : '');

    const links = [];
    if(u.phone) links.push('<a href="tel:' + esc(u.phone) + '">' + esc(u.phone) + '</a>');
    if(u.whatsapp) links.push('<a href="https://wa.me/' + esc(u.whatsapp.replace(/[^0-9]/g,'')) + '" target="_blank">WA</a>');
    if(u.instagram) links.push('<a href="https://instagram.com/' + esc(u.instagram.replace(/^@/,'')) + '" target="_blank">IG</a>');
    links.push('<a href="tg://user?id=' + u.tg_id + '">TG</a>');

    const vr = u.verified ? '<span class="rb" style="background:rgba(0,149,246,.18);color:#0095F6;">&#10004; Galichka</span>' : '';
    const bl = u.blocked ? '<span class="rb" style="background:rgba(237,73,86,.16);color:#ED4956;">Bloklangan</span>' : '';
    const ps = u.paused ? '<span class="rb pd">Toxtatilgan</span>' : '';

    return '<div class="au" data-id="' + u.tg_id + '">' +
      '<img src="https://api.dicebear.com/7.x/initials/svg?seed=' + encodeURIComponent(nm) + '">' +
      '<div class="ai"><b>' + esc(nm) + '</b>' +
      '<div class="ln">' + links.join(' &middot; ') + '</div>' +
      '<div style="display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;">' + role + st + vr + bl + ps + '</div></div>' +
      '<button class="menu-btn" style="width:34px;height:34px;border:none;background:none;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0;">&#8942;</button></div>';
  }).join('');

  box.querySelectorAll('.menu-btn').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      const id = b.closest('.au').dataset.id;
      const u = USERS.filter(function(x){ return String(x.tg_id) === String(id); })[0];
      if(u) openUserMenu(u);
    });
  });
}

function openUserMenu(u){
  const nm = u.name || u.instagram || ('ID ' + u.tg_id);
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" id="umSheet">' +
    '<div class="sheet-bar"></div>' +
    '<div class="sheet-title">' + esc(nm) + '</div>' +
    '<button class="sheet-item" data-a="edit">&#9999;&#65039;&nbsp;&nbsp;Maʼlumotlarni tahrirlash</button>' +
    '<button class="sheet-item" data-a="' + (u.verified ? 'unverify' : 'verify') + '">' +
      (u.verified ? '&#10060;&nbsp;&nbsp;Tasdiqni bekor qilish' : '&#9989;&nbsp;&nbsp;Tasdiqlangan belgisini berish') + '</button>' +
    '<button class="sheet-item" data-a="' + (u.paused ? 'unpause' : 'pause') + '">' +
      (u.paused ? '&#9654;&#65039;&nbsp;&nbsp;Faoliyatni tiklash' : '&#9208;&#65039;&nbsp;&nbsp;Faoliyatni toxtatish') + '</button>' +
    '<button class="sheet-item" data-a="' + (u.blocked ? 'unblock' : 'block') + '">' +
      (u.blocked ? '&#128275;&nbsp;&nbsp;Blokdan chiqarish' : '&#128683;&nbsp;&nbsp;Hisobni bloklash') + '</button>' +
    '<button class="sheet-item danger" data-a="delete">&#128465;&#65039;&nbsp;&nbsp;Hisobni butunlay ochirish</button>' +
    '</div>';

  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
  el('umSheet').addEventListener('click', function(e){ e.stopPropagation(); });

  bg.querySelectorAll('.sheet-item').forEach(function(b){
    b.addEventListener('click', function(){
      const a = b.dataset.a;
      if(a === 'edit'){ bg.remove(); editUser(u); return; }
      if(a === 'delete' && !confirm('Butunlay ochirasizmi?\n\nBarcha elonlar, obunachilar, xabarlar ochadi.')) return;
      if(a === 'block' || a === 'pause'){
        bg.remove();
        pickDays(a, u);
        return;
      }
      doAdmin(a, u.tg_id, { username: u.username || '' });
      bg.remove();
    });
  });
}

function editUser(u){
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" id="edSheet">' +
    '<div class="sheet-bar"></div><div class="sheet-title">Tahrirlash</div>' +
    '<div class="wrap">' +
      '<label class="label">Ism</label>' +
      '<input class="inp" id="edN" value="' + esc(u.name || '') + '">' +
      '<label class="label">Username</label>' +
      '<input class="inp" id="edU" value="' + esc(u.username || '') + '">' +
      '<button class="btn" id="edS">Saqlash</button>' +
    '</div></div>';

  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
  el('edSheet').addEventListener('click', function(e){ e.stopPropagation(); });

  el('edS').addEventListener('click', function(){
    doAdmin('edit', u.tg_id, {
      name: el('edN').value.trim(),
      username: el('edU').value.trim().replace(/^@/, '')
    });
    bg.remove();
  });
}

function doAdmin(action, tgId, extra){
  const body = { action: action, tg_id: tgId };
  for(const k in extra) body[k] = extra[k];
  apiPost('/api/admin-amal', body).then(function(d){
    if(d.ok){ toast('Bajarildi'); boot(); }
    else toast('Xato: ' + (d.error || ''));
  }).catch(function(){ toast('Server xatosi'); });
}


function pickDays(action, u){
  const title = action === 'block' ? 'Blok muddatini tanlang' : 'Toxtatish muddatini tanlang';
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" id="dySheet">' +
    '<div class="sheet-bar"></div><div class="sheet-title">' + title + '</div>' +
    [1,3,5,7,10].map(function(d){
      return '<button class="sheet-item" data-d="' + d + '">' + d + ' kun</button>';
    }).join('') +
    '<button class="sheet-item danger" data-d="9999">Muddatsiz</button></div>';

  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){ if(e.target === bg) bg.remove(); });
  el('dySheet').addEventListener('click', function(e){ e.stopPropagation(); });

  bg.querySelectorAll('.sheet-item').forEach(function(b){
    b.addEventListener('click', function(){
      doAdmin(action, u.tg_id, { username: u.username || '', days: parseInt(b.dataset.d) });
      bg.remove();
    });
  });
}

document.addEventListener('DOMContentLoaded', function(){
  el('q').addEventListener('input', function(e){
    const q = e.target.value.trim().toLowerCase();
    if(!q){ draw(USERS); return; }
    draw(USERS.filter(function(u){
      return (u.name || '').toLowerCase().indexOf(q) !== -1 ||
             (u.phone || '').indexOf(q) !== -1 ||
             (u.instagram || '').toLowerCase().indexOf(q) !== -1 ||
             (u.username || '').toLowerCase().indexOf(q) !== -1 ||
             String(u.tg_id).indexOf(q) !== -1;
    }));
  });
  setTimeout(function(){
    if(typeof checkSession === 'function'){
      checkSession(function(){ boot(); });
    } else boot();
  }, 400);
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof myId !== 'function' || !IS_ADMIN) return;
    if(typeof isApk === 'function' && !isApk()) return;

    const t = document.querySelector('.topbar h1') || document.querySelector('h1');
    if(!t) return;

    let ht = null;
    t.addEventListener('touchstart', function(){
      ht = setTimeout(function(){
        ht = null;
        if(typeof haptic === 'function') haptic('medium');
        if(typeof showAdminPanels === 'function') showAdminPanels(null, true);
      }, 700);
    }, { passive: true });
    t.addEventListener('touchend', function(){ if(ht) clearTimeout(ht); }, { passive: true });
    t.addEventListener('touchmove', function(){ if(ht) clearTimeout(ht); }, { passive: true });
  }, 900);
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof myId !== 'function' || !IS_ADMIN) return;

    const hh = document.querySelector('.topbar h1') || document.querySelector('h1');
    if(!hh || hh.querySelector('.pro-switch')) return;

    const txt = hh.innerHTML;
    hh.innerHTML = '';
    const b = document.createElement('button');
    b.className = 'pro-switch';
    b.innerHTML = '<span>' + txt + '</span><span class="cv">&#9660;</span>';
    hh.appendChild(b);

    b.addEventListener('click', function(){
      if(typeof haptic === 'function') haptic('light');
      if(typeof showAdminPanels === 'function') showAdminPanels(null, true);
    });
  }, 1000);
});

document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(typeof loadAdminState === 'function') loadAdminState();
  }, 500);
});
</script>
</body>
</html>
